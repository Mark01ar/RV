name: Analisis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analisis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/analisis_18m.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/analisis_18m.json
          git diff --cached --quiet || git commit -m "Analisis 18 meses"
          git push
