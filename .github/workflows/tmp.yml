name: tmp

on:
  push:
    branches: [prueba-factores]
    paths: [tmp/regimen_factores.py, .github/workflows/tmp.yml]

permissions:
  contents: write

jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tmp/regimen_factores.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add tmp/regimen.json tmp/regimen.txt
          git commit -m "Resultado regimen"
          git push
