name: Temporal

on:
  workflow_dispatch:

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tmp/pe_check.py && cat pe_check.json
