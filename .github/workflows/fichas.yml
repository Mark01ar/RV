name: Fichas

on:
  workflow_dispatch:
    inputs:
      solo:
        description: "Tickers separados por coma (vacio = todas)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  fichas:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fichas.py
        env:
          FICHAS_SOLO: ${{ github.event.inputs.solo }}
      - run: python scripts/factores.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Fichas $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
