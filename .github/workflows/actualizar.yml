name: Actualizar datos

on:
  schedule:
    - cron: "17 11 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          EV: ${{ github.event_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, datetime as dt
          try:
              ult = dt.datetime.fromisoformat(json.load(open("data/empresas.json"))["actualizado"])
              reciente = (dt.datetime.now(dt.timezone.utc) - ult).total_seconds() < 2 * 86400
          except Exception:
              reciente = False
          print(f"correr={'false' if os.environ['EV'] == 'schedule' and reciente else 'true'}")
          PY
      - if: steps.gate.outputs.correr == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.gate.outputs.correr == 'true'
        run: pip install -r requirements.txt
      - if: steps.gate.outputs.correr == 'true'
        run: python scripts/actualizar.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - if: steps.gate.outputs.correr == 'true'
        run: python scripts/fundamentales.py
        continue-on-error: true
      - if: steps.gate.outputs.correr == 'true'
        run: python scripts/macro.py
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - if: steps.gate.outputs.correr == 'true'
        run: python scripts/pilares.py
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - if: steps.gate.outputs.correr == 'true'
        run: python scripts/tiempo_real.py
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - if: steps.gate.outputs.correr == 'true'
        run: python scripts/fichas.py
        continue-on-error: true
      - if: steps.gate.outputs.correr == 'true'
        run: python scripts/traducir.py
        continue-on-error: true
      - if: steps.gate.outputs.correr == 'true'
        run: python scripts/factores.py
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - if: steps.gate.outputs.correr == 'true'
        run: python scripts/ciclos.py
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - if: steps.gate.outputs.correr == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Datos $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 15; done
