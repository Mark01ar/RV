<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaQ Renta Variable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e13;--panel:#11161e;--panel2:#161d27;--line:#232c39;--text:#d7dee8;--muted:#7d8a9b;
  --accent:#f0b429;--pos:#3ecf8e;--neg:#f2555a;--blue:#5aa9ff;
  --mono:"IBM Plex Mono",ui-monospace,monospace;--sans:"IBM Plex Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px}
a{color:var(--blue)}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:10}
#gate form{background:var(--panel);border:1px solid var(--line);padding:28px;width:min(340px,calc(100% - 32px))}
#gate h1{font-family:var(--mono);font-size:15px;margin:0 0 16px;color:var(--accent);letter-spacing:.08em}
#gate input{width:100%;padding:10px;background:var(--bg);border:1px solid var(--line);color:var(--text);font-family:var(--mono)}
#gate button{margin-top:12px;width:100%;padding:10px;background:var(--accent);border:0;color:#111;font-weight:600;cursor:pointer}
#gate .err{color:var(--neg);font-size:12px;min-height:16px;margin-top:8px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-family:var(--mono);font-weight:600;color:var(--accent);letter-spacing:.08em}
.kpis{display:flex;flex-wrap:wrap;gap:18px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.kpis b{color:var(--text);font-weight:500}
nav{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--panel)}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:10px 16px;font-family:var(--mono);font-size:12px;letter-spacing:.05em;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--text);border-bottom-color:var(--accent)}
nav button .pr{color:var(--line);margin-left:4px}
main{padding:14px 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar input,.bar select{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:7px 9px;font-family:var(--mono);font-size:12px}
.bar input{min-width:180px;flex:1;max-width:280px}
.bar .count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
details.help{background:var(--panel);border:1px solid var(--line);padding:8px 12px;margin-bottom:10px;font-size:12.5px;color:var(--muted)}
details.help summary{cursor:pointer;color:var(--text);font-family:var(--mono);font-size:12px}
details.help dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:10px 0 2px}
details.help dt{color:var(--text);font-family:var(--mono)}
details.help dd{margin:0}
.wrap{overflow:auto;border:1px solid var(--line);max-height:calc(100vh - 210px)}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12px}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:500;cursor:pointer;user-select:none}
th:hover{color:var(--text)}
th.l,td.l{text-align:left}
tbody tr:hover{background:var(--panel)}
td.tk{color:var(--accent);font-weight:600}
td.tk small{color:var(--muted);font-weight:400;margin-left:4px}
td.nm{max-width:220px;overflow:hidden;text-overflow:ellipsis;font-family:var(--sans)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--muted)}
.tag{display:inline-block;padding:1px 6px;border:1px solid var(--line);font-size:11px}
.tag.Alta{color:var(--pos);border-color:var(--pos)}
.tag.Media{color:var(--blue);border-color:var(--blue)}
.tag.Baja{color:var(--accent);border-color:var(--accent)}
.tag.Muy{color:var(--neg);border-color:var(--neg)}
.flag{color:var(--accent);cursor:help}
.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line)}
.soon{max-width:720px;padding:24px;border:1px dashed var(--line);color:var(--muted);line-height:1.6}
.soon h2{font-family:var(--mono);font-size:14px;color:var(--text);margin:0 0 8px}
.mx{display:grid;grid-template-columns:minmax(300px,440px) 1fr;gap:16px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);padding:14px}
.card h3{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:500}
.big{font-size:22px;font-weight:600;margin:2px 0 4px}
.sub{color:var(--muted);font-size:13px;line-height:1.5}
.probs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.probs div{border:1px solid var(--line);padding:8px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.probs b{display:block;font-size:17px;color:var(--text);margin-top:2px}
.warn{margin-top:10px;padding:8px 10px;border-left:3px solid var(--accent);background:var(--panel2);font-size:12.5px;color:var(--text)}
.ejes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.ind{width:100%;border-collapse:collapse;font-size:12px}
.ind td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top;white-space:normal;text-align:left}
.ind td.r{text-align:right;white-space:nowrap;font-family:var(--mono)}
.ind .tipo{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em;padding-top:12px}
.ind small{display:block;color:var(--muted);font-size:11px;margin-top:2px;line-height:1.4}
.zb{display:inline-block;width:70px;height:8px;background:var(--panel2);position:relative;vertical-align:middle}
.zb i{position:absolute;top:0;bottom:0}
.zb:after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.hm{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
.hm th,.hm td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.hm th{position:static;cursor:default;background:none}
.hm td.l,.hm th.l{text-align:left;font-family:var(--sans)}
.hm .on{outline:2px solid var(--accent);outline-offset:-2px}
.comp{display:flex;gap:14px;font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:6px}
.comp b{color:var(--text);font-weight:500}
svg text{font-family:var(--mono)}
@media (max-width:900px){.mx,.ejes{grid-template-columns:1fr}.probs{grid-template-columns:repeat(2,1fr)}}
.sem{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.luz{display:flex;flex-direction:column;gap:6px;background:#06080b;padding:8px;border:1px solid var(--line)}
.luz i{width:22px;height:22px;border-radius:50%;background:#1b222c;display:block}
.luz i.on.rojo{background:var(--neg);box-shadow:0 0 12px var(--neg)}
.luz i.on.amarillo{background:var(--accent);box-shadow:0 0 12px var(--accent)}
.luz i.on.verde{background:var(--pos);box-shadow:0 0 12px var(--pos)}
.chk{display:grid;gap:6px;font-size:13px}
.chk div{display:flex;gap:8px;align-items:baseline}
.chk b{font-family:var(--mono);font-size:11px;padding:1px 6px;border:1px solid currentColor}
.res{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;margin-top:10px}
.res th,.res td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.res th{position:static;cursor:default;background:none;font-weight:500}
.res td.l,.res th.l{text-align:left;font-family:var(--sans)}
.semgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-top:16px}
@media (max-width:900px){.sem{grid-template-columns:auto 1fr}.semgrid{grid-template-columns:1fr}}
.sbar{display:inline-block;width:46px;height:6px;background:var(--panel2);vertical-align:middle;margin-left:6px;position:relative}
.sbar i{position:absolute;left:0;top:0;bottom:0}
td.sc{font-weight:600}
tr.det td{background:var(--panel);white-space:normal;text-align:left}
.detg{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;padding:8px 4px;font-family:var(--sans)}
.detg h4{margin:0 0 6px;font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.05em}
.detg div{font-size:12px}
.detg dl{display:grid;grid-template-columns:1fr auto;gap:3px 10px;margin:0}
.detg dt{color:var(--muted)}
.detg dd{margin:0;font-family:var(--mono);text-align:right}
.bar input[type=checkbox]{min-width:0;flex:none;max-width:none;padding:0}
.chkl{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.sig{display:inline-block;padding:1px 7px;border:1px solid currentColor;font-size:11px;font-family:var(--mono)}
.alr{display:block;font-family:var(--mono);font-size:10px;color:var(--accent);margin-top:2px;cursor:help}
.cmb{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:6px}
.cmb h4{margin:0 0 6px;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.05em}
.cmb div{font-size:12.5px;line-height:1.7}
.cmb b{font-family:var(--mono);color:var(--accent);font-weight:600}
@media (max-width:900px){.cmb{grid-template-columns:1fr 1fr}}
.aviso{padding:8px 12px;border-left:3px solid var(--accent);background:var(--panel);font-size:12.5px;margin-bottom:10px}
@media (max-width:900px){.detg{grid-template-columns:1fr 1fr}}
@media (max-width:640px){main{padding:12px}.wrap{max-height:none}.bar input{max-width:none}}
</style>
</head>
<body>
<div id="gate">
  <form id="gf">
    <h1>MAQ · RENTA VARIABLE</h1>
    <input id="gp" type="password" placeholder="Clave" autocomplete="current-password" autofocus>
    <button type="submit">Entrar</button>
    <div class="err" id="ge"></div>
  </form>
</div>

<header>
  <div class="brand">MAQ · RENTA VARIABLE</div>
  <div class="kpis" id="kpis"></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<script>
const HASH = "3a892eea646c4e4fc44df3a264545ce2e51f4bdc752cbd996dae588e5c839602";
const TABS = [
  {id:"cartera", t:"Cartera del mes", ok:true},
  {id:"universo", t:"Universo", ok:true},
  {id:"macro", t:"Macro", ok:true},
  {id:"mapa", t:"Mapa", d:"Sensibilidad de cada empresa a crecimiento, inflación, tasa real, dólar y petróleo, y su encaje con el régimen actual."},
  {id:"fund", t:"Fundamentals", ok:true},
  {id:"matriz", t:"Matriz", d:"Cruce de encaje con el régimen y score fundamental. Ranking final con límite por sector."},
  {id:"revisor", t:"Revisor", d:"Pegás los CEDEARs de un cliente y ves qué posiciones están flojas, la concentración y por cuál conviene rotar cada una."},
  {id:"track", t:"Track record", d:"Ranking congelado cada semana y su rendimiento a 3 meses contra el S&P 500."}
];
let D = null, M = null, F = null, C = null, tab = "cartera", sortK = "monto_usd", sortDir = -1;
const st = {q:"", sector:"", liq:"", datos:true};

async function sha(s){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
function ses(k,v){try{if(v===undefined)return sessionStorage.getItem(k);sessionStorage.setItem(k,v)}catch(e){return null}}

document.getElementById("gf").addEventListener("submit", async e=>{
  e.preventDefault();
  if (await sha(document.getElementById("gp").value) === HASH){ ses("rv_ok","1"); abrir(); }
  else document.getElementById("ge").textContent = "Clave incorrecta";
});

async function abrir(){
  document.getElementById("gate").remove();
  try{
    const r = await fetch("data/datos.json?v=" + Date.now());
    if (r.ok) D = await r.json();
  }catch(e){}
  try{
    const r = await fetch("data/macro.json?v=" + Date.now());
    if (r.ok) M = await r.json();
  }catch(e){}
  try{
    const r = await fetch("data/fundamentales.json?v=" + Date.now());
    if (r.ok) F = await r.json();
  }catch(e){}
  try{
    const r = await fetch("data/cartera.json?v=" + Date.now());
    if (r.ok) C = await r.json();
  }catch(e){}
  kpis(); navegar(); render();
}

const pct = (x,d=1) => x==null ? "—" : (x>0?"+":"") + (x*100).toFixed(d) + "%";
const cls = x => x==null ? "mut" : x>0 ? "pos" : x<0 ? "neg" : "";
const num = (x,d=2) => x==null ? "—" : x.toLocaleString("es-AR",{minimumFractionDigits:d,maximumFractionDigits:d});
const usd = x => x==null ? "—" : x>=1e6 ? (x/1e6).toFixed(1)+"M" : x>=1e3 ? (x/1e3).toFixed(0)+"k" : x.toFixed(0);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function kpis(){
  const k = document.getElementById("kpis");
  if (!D){ k.innerHTML = "<span>Sin datos todavía</span>"; return; }
  const f = new Date(D.actualizado).toLocaleString("es-AR",{dateStyle:"short",timeStyle:"short"});
  k.innerHTML = `<span>Actualizado <b>${f}</b></span><span>CCL implícito <b>${num(D.ccl,0)}</b></span>
  <span>S&P 500 3M <b class="${cls(D.spy?.r3m)}">${pct(D.spy?.r3m)}</b></span><span>Universo <b>${D.n}</b></span>`;
}

function navegar(){
  document.getElementById("nav").innerHTML = TABS.map(x=>
    `<button class="${x.id===tab?"on":""}" data-t="${x.id}">${x.t}${x.ok?"":'<span class="pr">·</span>'}</button>`).join("");
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;navegar();render()});
}

function render(){
  const m = document.getElementById("main");
  const t = TABS.find(x=>x.id===tab);
  if (!t.ok){ m.innerHTML = `<div class="soon"><h2>${t.t} · en construcción</h2>${t.d}</div>`; return; }
  if (tab==="macro") return macro(m);
  if (tab==="fund") return fundamentals(m);
  if (tab==="cartera") return cartera(m);
  universo(m);
}

const COLS = [
  {k:"byma", t:"Ticker", l:1, h:"Código en BYMA. Si el ticker de EE.UU. es distinto, aparece al lado."},
  {k:"nombre", t:"Empresa", l:1},
  {k:"sector", t:"Sector", l:1},
  {k:"precio", t:"Precio USD", h:"Último cierre de la acción en EE.UU."},
  {k:"r1m", t:"1M", h:"Variación del último mes (21 ruedas)."},
  {k:"r3m", t:"3M", h:"Variación de los últimos 3 meses."},
  {k:"r12m", t:"12M", h:"Variación del último año."},
  {k:"mom12_1", t:"Mom 12-1", h:"Retorno de 12 meses sin el último mes. Es la medida estándar de momentum."},
  {k:"vs_ma200", t:"vs MA200", h:"Distancia al promedio de las últimas 200 ruedas. Positivo: tendencia alcista."},
  {k:"vol", t:"Vol", h:"Volatilidad anualizada del último año."},
  {k:"beta", t:"Beta", h:"Cuánto se mueve frente al S&P 500 (2 años, semanal). 1,5 = se mueve 50% más que el índice."},
  {k:"dd12m", t:"Caída máx", h:"Peor caída desde un máximo en los últimos 12 meses."},
  {k:"px_ars", t:"Precio ARS", h:"Último cierre del CEDEAR en BYMA, en pesos. Sirve para chequear contra tu pantalla."},
  {k:"monto_usd", t:"Operado/día", h:"Monto típico operado por día en BYMA (mediana de las últimas 20 ruedas), en USD al CCL implícito."},
  {k:"liquidez", t:"Liquidez", l:1, h:"Alta ≥ USD 1M/día · Media ≥ 200k · Baja ≥ 30k · Muy baja < 30k."},
  {k:"premio", t:"Premio CCL", h:"Cuánto más caro (+) o barato (−) cotiza el CEDEAR frente al CCL implícito de todo el mercado."}
];

function universo(m){
  if (!D){
    m.innerHTML = `<div class="empty">Todavía no hay datos. En GitHub: Actions → Actualizar datos → Run workflow.</div>`;
    return;
  }
  const sectores = [...new Set(D.tickers.map(x=>x.sector).filter(Boolean))].sort();
  m.innerHTML = `
  <div class="bar">
    <input id="q" placeholder="Buscar ticker o empresa" value="${esc(st.q)}">
    <select id="fs"><option value="">Todos los sectores</option>${sectores.map(s=>`<option ${s===st.sector?"selected":""}>${esc(s)}</option>`).join("")}</select>
    <select id="fl"><option value="">Toda liquidez</option>${["Alta","Media","Baja","Muy baja","Sin dato"].map(s=>`<option ${s===st.liq?"selected":""}>${s}</option>`).join("")}</select>
    <span class="count" id="cnt"></span>
  </div>
  <details class="help"><summary>Cómo leer esta tabla</summary>
    <dl>${COLS.filter(c=>c.h).map(c=>`<dt>${c.t}</dt><dd>${c.h}</dd>`).join("")}
    <dt>⚑</dt><dd>Nota sobre la empresa: historia corta, exposición a emergentes, ADR fuera de bolsa, etc. Pasá el mouse para verla.</dd></dl>
    ${D.sin_datos?.length?`<p>Sin datos esta semana: ${D.sin_datos.map(esc).join(", ")}</p>`:""}
  </details>
  <div class="wrap"><table><thead><tr>${COLS.map(c=>`<th class="${c.l?"l":""}" data-k="${c.k}" title="${esc(c.h||"")}">${c.t}${sortK===c.k?(sortDir>0?" ▲":" ▼"):""}</th>`).join("")}</tr></thead><tbody id="tb"></tbody></table></div>`;
  document.getElementById("q").oninput = e=>{st.q=e.target.value;filas()};
  document.getElementById("fs").onchange = e=>{st.sector=e.target.value;filas()};
  document.getElementById("fl").onchange = e=>{st.liq=e.target.value;filas()};
  document.querySelectorAll("th").forEach(th=>th.onclick=()=>{
    const k=th.dataset.k; sortDir = sortK===k ? -sortDir : (COLS.find(c=>c.k===k).l?1:-1); sortK=k; universo(m);
  });
  filas();
}

function filas(){
  const q = st.q.trim().toUpperCase();
  let r = D.tickers.filter(x=>
    (!q || x.byma.includes(q) || x.ticker.includes(q) || (x.nombre||"").toUpperCase().includes(q)) &&
    (!st.sector || x.sector===st.sector) && (!st.liq || x.liquidez===st.liq));
  r.sort((a,b)=>{
    const A=a[sortK], B=b[sortK];
    if (A==null && B==null) return 0; if (A==null) return 1; if (B==null) return -1;
    return (typeof A==="string" ? A.localeCompare(B) : A-B) * sortDir;
  });
  document.getElementById("cnt").textContent = `${r.length} de ${D.n}`;
  document.getElementById("tb").innerHTML = r.map(x=>`<tr>
    <td class="l tk">${esc(x.byma)}${x.ticker!==x.byma?`<small>${esc(x.ticker)}</small>`:""}${x.nota?` <span class="flag" title="${esc(x.nota)}">⚑</span>`:""}</td>
    <td class="l nm" title="${esc(x.industria||"")}">${esc(x.nombre)}</td>
    <td class="l mut">${esc(x.sector||"—")}</td>
    <td>${num(x.precio)}</td>
    <td class="${cls(x.r1m)}">${pct(x.r1m)}</td>
    <td class="${cls(x.r3m)}">${pct(x.r3m)}</td>
    <td class="${cls(x.r12m)}">${pct(x.r12m)}</td>
    <td class="${cls(x.mom12_1)}">${pct(x.mom12_1)}</td>
    <td class="${cls(x.vs_ma200)}">${pct(x.vs_ma200)}</td>
    <td>${x.vol==null?"—":(x.vol*100).toFixed(0)+"%"}</td>
    <td>${num(x.beta)}</td>
    <td class="neg">${pct(x.dd12m,0)}</td>
    <td title="${esc(x.px_fecha||"")}">${num(x.px_ars,0)}</td>
    <td>${usd(x.monto_usd)}</td>
    <td class="l"><span class="tag ${(x.liquidez||"").split(" ")[0]}">${esc(x.liquidez)}</span></td>
    <td class="${x.premio==null?"mut":x.premio>0.02?"neg":x.premio<-0.02?"pos":""}">${pct(x.premio)}</td>
  </tr>`).join("");
}

const QC = {CSI:"#3ecf8e", REC:"#f0b429", EST:"#f2555a", DES:"#5aa9ff"};

function zbar(z){
  if (z==null) return '<span class="mut">—</span>';
  const w = Math.min(Math.abs(z),3)/3*50, c = z>=0 ? "var(--pos)" : "var(--neg)";
  return `<span class="zb" title="z = ${z.toFixed(2)}"><i style="${z>=0?`left:50%`:`right:50%`};width:${w}%;background:${c}"></i></span>`;
}

function cuadSVG(){
  const W=380, P=34, S=(W-2*P)/2, cx=P+S, cy=P+S, k=S/2.5;
  const pos = (g,i) => [cx + Math.max(-2.5,Math.min(2.5,i))*k, cy - Math.max(-2.5,Math.min(2.5,g))*k];
  const cel = {CSI:[P,P], REC:[cx,P], DES:[P,cy], EST:[cx,cy]};
  let o = `<svg viewBox="0 0 ${W} ${W}" width="100%" style="max-width:${W}px;display:block">`;
  for (const [q,[x,y]] of Object.entries(cel)){
    const p = M.probs[q], on = q===M.actual;
    o += `<rect x="${x}" y="${y}" width="${S}" height="${S}" fill="${QC[q]}" fill-opacity="${0.06+p*0.5}" stroke="${on?QC[q]:"var(--line)"}" stroke-width="${on?2:1}"/>`;
    o += `<text x="${x+10}" y="${y+20}" font-size="11" fill="var(--text)">${{CSI:"Crec. sin inflación",REC:"Recalentamiento",EST:"Estanflación",DES:"Desinflación"}[q]}</text>`;
    o += `<text x="${x+10}" y="${y+40}" font-size="18" font-weight="600" fill="${QC[q]}">${Math.round(p*100)}%</text>`;
  }
  const tr = M.historial.slice(-7);
  const pts = tr.map(h=>pos(h.g,h.i));
  o += `<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--text)" stroke-opacity=".5" stroke-dasharray="3 3"/>`;
  pts.forEach((p,j)=>{ const last=j===pts.length-1;
    o += `<circle cx="${p[0]}" cy="${p[1]}" r="${last?6:2.5}" fill="${last?"var(--text)":"var(--muted)"}"><title>${tr[j].f}</title></circle>`; });
  o += `<text x="${W/2}" y="${P-10}" font-size="10" fill="var(--muted)" text-anchor="middle">CRECIMIENTO ACELERA ↑</text>`;
  o += `<text x="${W/2}" y="${W-P+18}" font-size="10" fill="var(--muted)" text-anchor="middle">CRECIMIENTO FRENA ↓</text>`;
  o += `<text x="${P-10}" y="${W/2}" font-size="10" fill="var(--muted)" text-anchor="middle" transform="rotate(-90 ${P-10} ${W/2})">← INFLACIÓN BAJA</text>`;
  o += `<text x="${W-P+14}" y="${W/2}" font-size="10" fill="var(--muted)" text-anchor="middle" transform="rotate(90 ${W-P+14} ${W/2})">INFLACIÓN SUBE →</text>`;
  return o + `</svg>`;
}

function bandaSVG(){
  const h = M.historial, W = 1000, H = 150, top = 24, bh = 18, n = h.length, bw = W/n;
  let o = `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="display:block;height:${H}px">`;
  h.forEach((x,j)=>{ const q=x.qc||x.q; o += `<rect x="${j*bw}" y="${top}" width="${bw+0.5}" height="${bh}" fill="${QC[q]}"><title>${x.f} · ${esc(M.cuadrantes[q].nombre)}</title></rect>`; });
  const y0 = top+bh+12, ch = H-y0-18, mid = y0+ch/2, sc = ch/2/2.5;
  const line = key => h.map((x,j)=>`${(j*bw+bw/2).toFixed(1)},${(mid - Math.max(-2.5,Math.min(2.5,x[key]))*sc).toFixed(1)}`).join(" ");
  o += `<line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="var(--line)"/>`;
  o += `<polyline points="${line("g")}" fill="none" stroke="var(--pos)" stroke-width="1.2"/>`;
  o += `<polyline points="${line("i")}" fill="none" stroke="var(--neg)" stroke-width="1.2"/>`;
  h.forEach((x,j)=>{ if (x.f.endsWith("-01") && +x.f.slice(0,4)%2===0)
    o += `<text x="${j*bw}" y="${H-4}" font-size="10" fill="var(--muted)">${x.f.slice(0,4)}</text>`; });
  o += `<text x="0" y="14" font-size="10" fill="var(--muted)">RÉGIMEN MES A MES</text>`;
  o += `<text x="${W}" y="14" font-size="10" fill="var(--muted)" text-anchor="end"><tspan fill="var(--pos)">— crecimiento</tspan>  <tspan fill="var(--neg)">— inflación</tspan></text>`;
  return o + `</svg>`;
}

          <tr><td class="l">Rinde 2019–hoy</td><td class="${tr["2019-hoy"].regla>tr["2019-hoy"].spy?"pos":""}">${pct(tr["2019-hoy"].regla)}</td><td>${pct(tr["2019-hoy"].spy)}</td></tr>
        </table>

      <div><h3 style="margin-top:4px">VECES QUE SE PRENDIÓ EN ROJO</h3>

      <p>${S.base==="tiempo_real"?`<b>Datos honestos:</b> el historial se reconstruyó con los datos macro <b>tal como se conocían cada mes</b> (archivo ALFRED de la Fed de St. Louis), sin las revisiones posteriores. O sea, muestra lo que el semáforo hubiera dicho en su momento. Actividad (CFNAI) tiene versiones desde ${S.cobertura?.CFNAIMA3||"2011"} y subsidios por desempleo desde ${S.cobertura?.ICSA||"2009"}; antes de esas fechas se usa su primera versión disponible.`:`Ojo: el historial usa datos macro revisados, así que en tiempo real podría haber funcionado algo distinto.`}</p>
    </details></div>`;
}

  const f = new Date(M.actualizado).toLocaleDateString("es-AR");
  m.innerHTML = `${semaforoHTML()}
  <div class="mx" style="margin-top:16px">
    <div class="card"><h3>DÓNDE ESTÁ EE.UU.</h3>${cuadSVG()}
      <div class="sub" style="margin-top:6px">El punto blanco es hoy. Los grises son los 6 meses anteriores.</div></div>

        ${M.crudo && M.crudo!==M.actual?`<div class="warn">Posible cambio a <b style="color:${QC[M.crudo]}">${esc(M.cuadrantes[M.crudo].nombre)}</b> (${Math.round(M.probs[M.crudo]*100)}%). Se confirma si se repite el mes que viene o si supera el ${Math.round(M.umbral*100)}%.</div>`:""}
        <div class="sub" style="margin-top:8px">${esc(q.guia)}</div>
        <div class="probs">${["CSI","REC","EST","DES"].map(k=>`<div style="border-color:${k===M.actual?QC[k]:"var(--line)"}">${esc(M.cuadrantes[k].nombre)}<b style="color:${QC[k]}">${Math.round(M.probs[k]*100)}%</b></div>`).join("")}</div>
        ${div.length?`<div class="warn">Datos y mercado no coinciden en ${div.map(g=>g==="inflacion"?"inflación":g).join(" e ")}: el mercado puede estar anticipando un cambio que los datos todavía no muestran.</div>`:""}
      </div>
      <details class="help" style="margin-top:16px"><summary>Cómo se calcula</summary>
        <p>Cada indicador se mide como <b>dirección</b>: si se acelera o se frena en los últimos 3 meses. Ese cambio se compara con su propia historia (desvíos respecto de su promedio), así un número alto quiere decir "se acelera más de lo normal".</p>
        <p>Se promedian los indicadores de cada eje: ${Math.round(M.peso_dato*100)}% datos oficiales (FRED) y ${Math.round((1-M.peso_dato)*100)}% señales de mercado, que reaccionan antes. Con el puntaje de cada eje sale la probabilidad de que el crecimiento y la inflación se estén acelerando, y de ahí la probabilidad de cada cuadrante.</p>

        <p><b>Regla de confirmación:</b> el régimen solo cambia si el nuevo cuadrante se repite dos meses seguidos o si su probabilidad supera el ${Math.round((M.umbral||0.45)*100)}%. Así se evita rotar la cartera por un dato aislado.${M.cambios!=null?` Desde 2000 hubo ${M.cambios} cambios con la regla, contra ${M.cambios_sin_regla} sin ella.`:""}</p>

const fs = {q:"", sector:"", liq:"", ma:false, av:false, sig:"", sort:"total", dir:-1, abierto:null};
let UMB = {alto:65, bajo:40};
const SIG = {comprar:{t:"Comprar",c:"var(--pos)",o:1}, esperar:{t:"Esperar",c:"var(--accent)",o:2}, neutral:{t:"Neutral",c:"var(--muted)",o:3}, evitar:{t:"Evitar",c:"var(--neg)",o:4}};
function senal(x){
  const t = x.scores.total; if (t==null) return null;
  if (t < UMB.bajo) return "evitar";
  if (t < UMB.alto) return "neutral";
  return (x.raw.vs_ma200??-1) > 0 ? "comprar" : "esperar";
}
function alertas(x){
  const a = [], s = senal(x);
  if (s!=="comprar" && s!=="esperar") return a;
  if (x.premio!=null && x.premio > 0.03) a.push({c:`CCL ${pct(x.premio,0)}`, t:`El CEDEAR cotiza ${pct(x.premio,1)} por encima del CCL implícito del mercado: está caro contra su subyacente.`});
  if (["Muy baja","Sin dato"].includes(x.liquidez)) a.push({c:"liquidez", t:`Liquidez ${x.liquidez.toLowerCase()} en BYMA: puede costar entrar y salir al precio de pantalla.`});
  const d = dias(x.raw.proximo_balance);
  if (d!=null && d>=0 && d<=7) a.push({c:`balance ${d}d`, t:`Presenta balance en ${d} días. En 20 años de historia, la semana del balance rindió en promedio algo más que el resto, pero con más volatilidad: no es motivo para no comprar, pero esperá movimientos fuertes.`});
  return a;
}
function porQue(x){
  const s = senal(x), r = x.raw, t = Math.round(x.scores.total??0);
  if (s==="evitar") return `Puntaje ${t}: por debajo de ${UMB.bajo}.`;
  if (s==="neutral") return `Puntaje ${t}: entre ${UMB.bajo} y ${UMB.alto}.`;
  return s==="comprar" ? `Puntaje ${t} y sobre su MA200.` : `Puntaje ${t}, pero debajo de su MA200: buena empresa, tendencia rota.`;
}
const scol = v => v==null ? "var(--muted)" : v>=70 ? "var(--pos)" : v>=40 ? "var(--accent)" : "var(--neg)";
const sc = v => v==null ? '<span class="mut">—</span>' : `${Math.round(v)}<span class="sbar"><i style="width:${v}%;background:${scol(v)}"></i></span>`;
const fecha = s => s ? new Date(s).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"2-digit"}) : "—";
const dias = s => s ? Math.round((new Date(s) - new Date())/864e5) : null;

function detalle(x){
  const r = x.raw, P = (v,d=1)=>pct(v,d), N=(v,d=1)=>v==null?"—":num(v,d), S = v => v==null?"—":Math.round(v);
  const sb = x.sub || {};
  const g = (t, items) => `<div><h4>${t}</h4><dl>${items.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join("")}</dl></div>`;
  return `<tr class="det"><td colspan="13"><div class="detg">
    ${g(`REVISIONES · ${S(x.scores.revisiones)}`,[["EPS este año, 90 días",P(r.rev90_0y)],["EPS año próximo, 90 días",P(r.rev90_1y)],["Analistas que suben / bajan (30d)",`${r.rev_suben??"—"} / ${r.rev_bajan??"—"}`],["Sorpresa último balance",P(r.sorpresa)],["Balances que superaron estimaciones",r.consistencia==null?"—":`${Math.round(r.consistencia*(r.n_balances||0))} de ${r.n_balances}`]])}
    ${g(`MOMENTUM · ${S(x.scores.momentum)}`,[["Retorno 12 meses sin el último",P(r.mom12_1)],["Distancia a MA200",P(r.vs_ma200)]])}
    ${g(`CALIDAD · ${S(x.scores.calidad)}`,[[`<b>Rentabilidad · ${S(sb.rentabilidad)}</b>`,""],[r.roic!=null?"ROIC (retorno s/ capital invertido)":"Rentabilidad sobre activos",P(r.roic!=null?r.roic:r.roa)],["Margen operativo",P(r.margen_op)],["Margen bruto",P(r.margen_bruto)],
      [`<b>Solidez · ${S(sb.solidez)}</b>`,""],["Deuda neta / EBITDA",r.deuda_ebitda==null?"—":N(r.deuda_ebitda)+"x"],["F-score (0 a 9)",N(r.fscore,1)],
      [`<b>Calidad de ganancias · ${S(sb.ganancias)}</b>`,""],["Ganancia no cobrada / activos",P(r.accruals)],["Variabilidad del margen",P(r.estab_margen)],["Dilución en 12 meses",P(r.dilucion)]])}
    ${g(`VALUACIÓN · ${S(x.scores.valuacion)}`,[["P/E forward",N(r.forward_pe)],["Rendimiento de ganancias",P(r.ey)],["Flujo de caja libre / capitalización",P(r.fcf_yield)],["P/E actual",N(r.pe_trailing)],["P/E mediano de sus últimos años",N(r.pe_hist)],["P/E actual vs su historia",r.pe_vs_hist==null?"—":N(r.pe_vs_hist,2)+"x"],["Crecimiento de ventas",P(r.crec_ventas)]])}
    ${g("INFORMATIVO (NO SUMA AL PUNTAJE)",[["Recomendación (1 compra – 5 venta)",N(r.recom,2)],["Analistas",r.n_analistas??"—"],["Upside al precio objetivo",P(r.upside)],["Último balance",fecha(r.ultimo_balance)]])}
  </div>${r.dato_previo?'<div class="sub" style="padding:0 4px 6px">Esta semana Yahoo no devolvió datos: se muestran los de la semana anterior.</div>':""}</td></tr>`;
}

function cambiosHTML(){
  const C = F.cambios;
  if (!C) return `<div class="card" style="margin-bottom:10px"><h3>QUÉ CAMBIÓ ESTA SEMANA</h3><div class="sub">Se completa a partir de la próxima actualización semanal: necesita una foto anterior para comparar.</div></div>`;
  const tk = x => `<b>${esc(x.byma)}</b>`;
  const lista = (arr, f) => arr.length ? arr.map(f).join("<br>") : '<span class="mut">Ninguna</span>';
  const SN = {comprar:"Comprar",esperar:"Esperar",neutral:"Neutral",evitar:"Evitar"};
  return `<details class="card" style="margin-bottom:10px" open><summary style="cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em">QUÉ CAMBIÓ DESDE EL ${esc(new Date(C.desde+"T12:00").toLocaleDateString("es-AR"))}</summary>
    <div class="cmb">
      <div><h4 style="color:var(--pos)">ENTRARON A COMPRAR · ${C.entran.length}</h4>${lista(C.entran, x=>`${tk(x)} <span class="mut">${Math.round(x.total)} · antes ${SN[x.antes]||"—"}</span>`)}</div>
      <div><h4 style="color:var(--neg)">SALIERON DE COMPRAR · ${C.salen.length}</h4>${lista(C.salen, x=>`${tk(x)} <span class="mut">ahora ${SN[x.ahora]||"—"}</span>`)}</div>
      <div><h4>MÁS SUBIERON DE PUNTAJE</h4>${lista(C.suben, x=>`${tk(x)} <span class="pos">+${x.delta.toFixed(0)}</span> <span class="mut">→ ${Math.round(x.total)}</span>`)}</div>
      <div><h4>MÁS BAJARON DE PUNTAJE</h4>${lista(C.bajan, x=>`${tk(x)} <span class="neg">${x.delta.toFixed(0)}</span> <span class="mut">→ ${Math.round(x.total)}</span>`)}</div>
    </div></details>`;
}

function fundamentals(m){
  if (F && F.umbrales) UMB = F.umbrales;
  if (!F){ m.innerHTML = `<div class="empty">Todavía no hay datos de fundamentals. Corré Actions → Actualizar datos.</div>`; return; }
  const sectores = [...new Set(F.tickers.map(x=>x.sector).filter(Boolean))].sort();
  const f = new Date(F.actualizado).toLocaleDateString("es-AR");
  m.innerHTML = `
  <div class="aviso"><b>Momentum y MA200 validados</b> con 20 años de historia; revisiones, calidad y valuación todavía no (se validan con el track record semanal). Usalo para ordenar ideas y revisalo una vez por mes. Actualizado ${f}.</div>
  ${cambiosHTML()}
  <div class="bar">
    <input id="fq" placeholder="Buscar ticker o empresa" value="${esc(fs.q)}">
    <select id="fsec"><option value="">Todos los sectores</option>${sectores.map(s=>`<option ${s===fs.sector?"selected":""}>${esc(s)}</option>`).join("")}</select>
    <select id="fliq"><option value="">Toda liquidez</option><option value="am" ${fs.liq==="am"?"selected":""}>Solo Alta y Media</option></select>
    <select id="fsig"><option value="">Todas las señales</option>${Object.entries(SIG).map(([k,v])=>`<option value="${k}" ${fs.sig===k?"selected":""}>${v.t}</option>`).join("")}</select>
    <label class="chkl"><input type="checkbox" id="fma" ${fs.ma?"checked":""}> Sobre MA200</label>
    <span class="count" id="fcnt"></span>
  </div>
  <details class="help"><summary>Cómo se calcula</summary>
    <p>Cada empresa se compara contra las otras ${F.n} del universo en cuatro bloques, y en cada uno recibe un puntaje de 0 a 100 (100 = la mejor). El total es el promedio ponderado:</p>
    <dl>
      <dt>Revisiones · ${Math.round(F.pesos.revisiones*100)}%</dt><dd>Cuánto subieron o bajaron las estimaciones de ganancias de los analistas en 90 días (este año y el próximo), cuántos analistas las suben contra cuántos las bajan, la sorpresa del último balance y en cuántos de los últimos 8 balances superó las estimaciones. Es el bloque con más evidencia para horizontes de 3 meses.</dd>
      <dt>Momentum · ${Math.round(F.pesos.momentum*100)}%</dt><dd>Retorno de 12 meses sin contar el último mes, y distancia al promedio de 200 ruedas.</dd>
      <dt>Calidad · ${Math.round(F.pesos.calidad*100)}%</dt><dd>Tres partes iguales. <b>Rentabilidad:</b> ROIC (cuánto gana por cada dólar invertido en el negocio), margen operativo y margen bruto. <b>Solidez:</b> deuda neta sobre EBITDA y F-score de Piotroski (9 pruebas año contra año: si gana plata, si genera caja, si mejora la rentabilidad, si baja la deuda, si mejora la liquidez, si no emite acciones, si mejoran el margen y la rotación de activos). <b>Calidad de las ganancias:</b> si la ganancia contable se convierte en caja, qué tan estable es el margen trimestre a trimestre, y si la empresa diluye a los accionistas emitiendo acciones. En bancos y aseguradoras solo cuentan la rentabilidad sobre activos y la dilución, porque el resto no aplica.</dd>
      <dt>Valuación · ${Math.round(F.pesos.valuacion*100)}%</dt><dd>Rendimiento de ganancias (la inversa del P/E forward) comparado <b>dentro de su sector</b>, flujo de caja libre sobre capitalización, y P/E actual contra su propia mediana de los últimos años (solo empresas de EE.UU.: en las extranjeras la moneda y el ratio del ADR lo distorsionan). Las empresas extranjeras se convierten a dólares.</dd>
      <dt>Señal</dt><dd><b style="color:var(--pos)">Comprar</b>: puntaje de ${UMB.alto} o más y precio sobre su promedio de 200 ruedas. <b style="color:var(--accent)">Esperar</b>: puntaje de ${UMB.alto} o más, pero debajo de la MA200 (buena empresa, tendencia rota). <b>Neutral</b>: puntaje entre ${UMB.bajo} y ${UMB.alto}. <b style="color:var(--neg)">Evitar</b>: puntaje menor a ${UMB.bajo}.</dd>
      <dt>Alertas ⚠</dt><dd>En las señales Comprar y Esperar se marcan tres cosas que no cambian el puntaje pero sí cómo operar: <b>CCL</b> si el CEDEAR está más de 3% caro contra el CCL implícito, <b>liquidez</b> si se opera muy poco en BYMA, y <b>balance</b> si presenta resultados en los próximos 7 días (no es motivo para no comprar: históricamente la semana del balance rindió algo más en promedio, pero con más volatilidad).</dd>
      <dt>Qué está validado</dt><dd>Probado con 20 años de historia (2006–2026, 266 empresas, con costos): el momentum por acción le ganó al promedio del universo en los dos períodos, y esperar a que la acción esté sobre su MA200 bajó la peor caída de −52% a −45% sin costar rendimiento. Conviene revisar el puntaje <b>todos los meses</b>: con revisión trimestral rindió menos. También se probaron filtros de VWAP (anclado al balance y móvil de 1, 3, 6 y 12 meses) y ninguno mejoró a la MA200. Revisiones, calidad y valuación no tienen historia gratuita: se validan con la foto semanal que guarda el monitor.</dd>
    </dl>
    <p>Si a una empresa le faltan datos en un bloque, el total se calcula con los bloques disponibles (mínimo 3 de 4).</p>
  </details>
  <div class="wrap"><table><thead><tr>
    ${[["puesto","#"],["byma","Ticker",1],["nombre","Empresa",1],["sector","Sector",1],["senal","Señal"],["total","Puntaje"],["revisiones","Revis."],["momentum","Mom."],["calidad","Calidad"],["valuacion","Valuac."],["vs_ma200","MA200"],["proximo_balance","Próx. balance"],["liquidez","Liquidez",1]]
      .map(([k,t,l])=>`<th class="${l?"l":""}" data-k="${k}">${t}${fs.sort===k?(fs.dir>0?" ▲":" ▼"):""}</th>`).join("")}
  </tr></thead><tbody id="ftb"></tbody></table></div>`;
  const re = ()=>fundFilas();
  document.getElementById("fq").oninput = e=>{fs.q=e.target.value;re()};
  document.getElementById("fsec").onchange = e=>{fs.sector=e.target.value;re()};
  document.getElementById("fliq").onchange = e=>{fs.liq=e.target.value;re()};
  document.getElementById("fsig").onchange = e=>{fs.sig=e.target.value;re()};
  document.getElementById("fma").onchange = e=>{fs.ma=e.target.checked;re()};
  m.querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;
    fs.dir = fs.sort===k ? -fs.dir : (["byma","nombre","sector","liquidez","puesto","proximo_balance","senal"].includes(k)?1:-1); fs.sort=k; fundamentals(m);});
  re();
}

function fundFilas(){
  const q = fs.q.trim().toUpperCase();
  const val = x => fs.sort==="senal" ? (SIG[senal(x)]?.o ?? 9) : ["total","revisiones","momentum","calidad","valuacion"].includes(fs.sort) ? x.scores[fs.sort]
    : ["vs_ma200","proximo_balance"].includes(fs.sort) ? x.raw[fs.sort] : x[fs.sort];
  let r = F.tickers.filter(x=>
    (!q || x.byma.includes(q) || x.ticker.includes(q) || (x.nombre||"").toUpperCase().includes(q)) &&
    (!fs.sector || x.sector===fs.sector) && (!fs.liq || ["Alta","Media"].includes(x.liquidez)) &&
    (!fs.ma || (x.raw.vs_ma200??-1) > 0) && (!fs.sig || senal(x)===fs.sig));
  r.sort((a,b)=>{ const A=val(a), B=val(b);
    if (A==null && B==null) return 0; if (A==null) return 1; if (B==null) return -1;
    return (typeof A==="string" ? A.localeCompare(B) : A-B) * fs.dir; });
  const cnt = {}; F.tickers.forEach(x=>{const k=senal(x); if(k) cnt[k]=(cnt[k]||0)+1;});
  document.getElementById("fcnt").innerHTML = `${Object.entries(SIG).map(([k,v])=>`<span style="color:${v.c}">${v.t} ${cnt[k]||0}</span>`).join(" · ")} &nbsp; ${r.length} de ${F.n}`;
  const tb = document.getElementById("ftb");
  tb.innerHTML = r.map(x=>{ const d = dias(x.raw.proximo_balance), pronto = d!=null && d>=0 && d<=14;
    return `<tr data-t="${esc(x.ticker)}" style="cursor:pointer">
    <td class="mut">${x.puesto??"—"}</td>
    <td class="l tk">${esc(x.byma)}${x.ticker!==x.byma?`<small>${esc(x.ticker)}</small>`:""}${x.nota?` <span class="flag" title="${esc(x.nota)}">⚑</span>`:""}</td>
    <td class="l nm">${esc(x.nombre)}</td>
    <td class="l mut">${esc(x.sector||"—")}</td>
    <td class="l">${(()=>{const k=senal(x); if(!k) return '<span class="mut">—</span>'; const al = alertas(x);
      return `<span class="sig" style="color:${SIG[k].c}" title="${esc(porQue(x))}">${SIG[k].t}</span>${al.map(a=>`<span class="alr" title="${esc(a.t)}">⚠ ${esc(a.c)}</span>`).join("")}`})()}</td>
    <td class="sc">${sc(x.scores.total)}</td>
    <td>${sc(x.scores.revisiones)}</td><td>${sc(x.scores.momentum)}</td><td>${sc(x.scores.calidad)}</td><td>${sc(x.scores.valuacion)}</td>
    <td class="${cls(x.raw.vs_ma200)}">${pct(x.raw.vs_ma200)}</td>
    <td style="${pronto?"color:var(--accent)":""}" title="${pronto?"Balance en los próximos 14 días":""}">${fecha(x.raw.proximo_balance)}${pronto?` · ${d}d`:""}</td>
    <td class="l"><span class="tag ${(x.liquidez||"").split(" ")[0]}">${esc(x.liquidez||"—")}</span></td></tr>
    ${fs.abierto===x.ticker?detalle(x):""}`; }).join("");
  tb.querySelectorAll("tr[data-t]").forEach(tr=>tr.onclick=()=>{ fs.abierto = fs.abierto===tr.dataset.t ? null : tr.dataset.t; fundFilas(); });
}

const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const nomMes = ym => { const [y,mm] = ym.split("-"); return `${MESES[+mm-1]} ${y}`; };

function alertasCartera(p){
  const a = [];
  if (p.premio!=null && p.premio > 0.03) a.push({c:`CCL ${pct(p.premio,0)}`, t:`El CEDEAR está ${pct(p.premio,1)} caro contra el CCL implícito: conviene orden límite o esperar.`});
  const d = dias(p.proximo_balance);
  if (d!=null && d>=0 && d<=7) a.push({c:`balance ${d}d`, t:`Presenta balance en ${d} días. En 20 años de historia, la semana del balance rindió en promedio algo más que el resto, pero con más volatilidad: no es motivo para no comprar, pero esperá movimientos fuertes.`});
  if (p.vs_ma200_hoy!=null && p.vs_ma200_hoy < 0 && p.en_cartera) a.push({c:"perdió MA200", t:"Desde que se armó la cartera, el precio quedó debajo de su MA200. No se vende hasta el rebalanceo, pero no conviene sumar."});
  return a;
}

function cartera(m){
  if (!C){ m.innerHTML = `<div class="empty">Todavía no hay cartera armada.</div>`; return; }
  const P = C.posiciones, act = P.filter(p=>p.en_cartera), liq = P.filter(p=>!p.en_cartera);
  const sect = {}; act.forEach(p=>{ sect[p.sector||"Otro"] = (sect[p.sector||"Otro"]||0) + 1; });
  const tr = C.track || [], ult = tr[tr.length-1];
  const fila = (p, sup) => { const al = alertasCartera(p);
    return `<tr${sup?' style="opacity:.75"':""}>
      <td class="mut">${p.puesto}</td>
      <td class="l tk">${esc(p.byma)}${p.ticker!==p.byma?`<small>${esc(p.ticker)}</small>`:""}</td>
      <td class="l nm">${esc(p.nombre)}</td>
      <td class="l mut">${esc(p.sector||"—")}</td>
      <td>${sup?'<span class="mut">suplente</span>':p.en_cartera?`${Math.round(100/C.parametros.n)}%`:'<span class="mut">a letras</span>'}</td>
      <td class="${cls(p.mom12_1)}">${pct(p.mom12_1,0)}</td>
      <td class="${cls(p.vs_ma200_hoy)}">${pct(p.vs_ma200_hoy)}</td>
      <td class="${cls(p.desde_armado)}">${sup?"—":pct(p.desde_armado)}</td>
      <td>${num(p.px_ars_hoy,0)}</td>
      <td>${p.total==null?'<span class="mut">—</span>':Math.round(p.total)}</td>
      <td class="l"><span class="tag ${(p.liquidez_hoy||p.liquidez||"").split(" ")[0]}">${esc(p.liquidez_hoy||p.liquidez)}</span></td>
      <td class="l">${al.map(a=>`<span class="alr" title="${esc(a.t)}">⚠ ${esc(a.c)}</span>`).join("")}</td></tr>`; };
  const cmb = C.cambios;
  m.innerHTML = `
  <div class="card" style="border-color:var(--accent)">
    <h3>RECOMENDACIONES DE ${nomMes(C.mes).toUpperCase()}</h3>
    <div class="sub">Armada el ${new Date(C.fecha+"T12:00").toLocaleDateString("es-AR")} con la estrategia validada (momentum + MA200), entre los ${C.n_elegibles} CEDEARs con liquidez suficiente para retail. ${C.parametros.n} acciones con igual peso. <b style="color:var(--text)">Sugerencia: 75% en SPY y 25% repartido en estas ${C.parametros.n}.</b> Queda fija todo el mes; el primer sábado del mes que viene se rearma y acá vas a ver qué vender y qué comprar.</div>
    ${cmb?`<div class="cmb" style="grid-template-columns:repeat(3,1fr);margin-top:12px">
      <div><h4 style="color:var(--neg)">VENDER · ${cmb.vender.length}</h4>${cmb.vender.length?cmb.vender.map(t=>`<b>${esc(t)}</b>`).join(" · "):'<span class="mut">Ninguna</span>'}</div>
      <div><h4 style="color:var(--pos)">COMPRAR · ${cmb.comprar.length}</h4>${cmb.comprar.length?cmb.comprar.map(t=>`<b>${esc(t)}</b>`).join(" · "):'<span class="mut">Ninguna</span>'}</div>
      <div><h4>MANTENER · ${cmb.mantener.length}</h4>${cmb.mantener.map(t=>`<b>${esc(t)}</b>`).join(" · ")||'<span class="mut">Ninguna</span>'}</div></div>`
      :`<div class="sub" style="margin-top:10px"><b style="color:var(--text)">Primera cartera:</b> comprar las ${act.length} en partes iguales${liq.length?` y dejar ${liq.length*Math.round(100/C.parametros.n)}% en letras o caución`:""}.</div>`}
  </div>
  <div class="semgrid" style="grid-template-columns:2fr 1fr">
    <div class="card"><h3>DESDE QUE SE ARMÓ</h3>
      <div style="display:flex;gap:28px;font-family:var(--mono)">
        <div><div class="sub">Cartera</div><div class="big ${cls(ult?.cartera)}">${ult?pct(ult.cartera):"—"}</div></div>
        <div><div class="sub">S&P 500 (SPY)</div><div class="big ${cls(C.spy_desde)}">${pct(C.spy_desde)}</div></div>
        <div><div class="sub">Diferencia</div><div class="big ${cls(ult?.dif)}">${ult?pct(ult.dif):"—"}</div></div>
      </div><div class="sub" style="margin-top:6px">Incluye el costo de compra y venta (${String(C.parametros.costo*100).replace(".",",")}% por operación). En dólares, sobre el precio de las acciones en EE.UU.</div></div>
    <div class="card"><h3>SECTORES</h3>${Object.entries(sect).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="sub" style="display:flex;justify-content:space-between"><span>${esc(k)}</span><b style="color:var(--text);font-family:var(--mono)">${v*Math.round(100/C.parametros.n)}%</b></div>`).join("")}</div>
  </div>
  <div class="wrap" style="margin-top:16px;max-height:none"><table><thead><tr>
    <th>#</th><th class="l">Ticker</th><th class="l">Empresa</th><th class="l">Sector</th><th>Peso</th><th>Mom 12-1</th><th>vs MA200</th><th>Desde armado</th><th>Precio ARS</th><th>Puntaje fund.</th><th class="l">Liquidez</th><th class="l">Alertas</th>
  </tr></thead><tbody>${P.map(p=>fila(p,false)).join("")}
    <tr><td colspan="12" class="l mut" style="font-family:var(--mono);font-size:11px;padding-top:12px">SUPLENTES · si alguna no se puede comprar, se reemplaza por la primera de esta lista</td></tr>
    ${(C.suplentes||[]).map(p=>fila(p,true)).join("")}</tbody></table></div>
  ${tr.length>1?`<div class="card" style="margin-top:16px"><h3>TRACK RECORD MES A MES</h3><table class="res"><tr><th class="l">Mes</th><th>Cartera</th><th>SPY</th><th>Diferencia</th><th>Acum. cartera</th><th>Acum. SPY</th></tr>
    ${tr.slice().reverse().map(t=>`<tr><td class="l">${nomMes(t.mes)}${t.parcial?' <span class="mut">(en curso)</span>':""}</td><td class="${cls(t.cartera)}">${pct(t.cartera)}</td><td class="${cls(t.spy)}">${pct(t.spy)}</td><td class="${cls(t.dif)}">${pct(t.dif)}</td><td class="${cls(t.acum_cartera)}">${pct(t.acum_cartera)}</td><td class="${cls(t.acum_spy)}">${pct(t.acum_spy)}</td></tr>`).join("")}</table></div>`:""}
  <details class="help" style="margin-top:16px"><summary>Cómo usarla</summary>
