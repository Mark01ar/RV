<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MR Renta Variable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070c1f;--panel:#0d1430;--panel2:#141d40;--line:#1e2a56;--text:#e9edf7;--muted:#8a94b8;
  --accent:#e8c264;--pos:#45c27c;--neg:#ef6b6b;--blue:#6ea8ff;
  --mono:"Inter",system-ui,sans-serif;--sans:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px}
a{color:var(--blue)}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:10}
#gate form{background:var(--panel);border:1px solid var(--line);padding:28px;width:min(340px,calc(100% - 32px))}
#gate h1{font-family:var(--mono);font-size:15px;margin:0 0 16px;color:var(--accent);letter-spacing:.08em}
#gate input{width:100%;padding:10px;background:var(--bg);border:1px solid var(--line);color:var(--text);font-family:var(--mono)}
#gate button{margin-top:12px;width:100%;padding:10px;background:var(--accent);border:0;color:#111;font-weight:600;cursor:pointer}
#gate .err{color:var(--neg);font-size:12px;min-height:16px;margin-top:8px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-family:var(--mono);font-weight:600;color:var(--accent);letter-spacing:.08em}
.kpis{display:flex;flex-wrap:wrap;gap:18px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.kpis b{color:var(--text);font-weight:500}
.vivo{margin-left:auto;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.vivo button{background:none;border:1px solid var(--accent);color:var(--accent);padding:6px 12px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;cursor:pointer}
.vivo button:disabled{opacity:.5;cursor:wait}
nav{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--panel)}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:10px 16px;font-family:var(--mono);font-size:12px;letter-spacing:.05em;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--text);border-bottom-color:var(--accent)}
nav button .pr{color:var(--line);margin-left:4px}
main{padding:14px 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar input,.bar select{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:7px 9px;font-family:var(--mono);font-size:12px}
.bar input{min-width:180px;flex:1;max-width:280px}
.bar .count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
details.help{background:var(--panel);border:1px solid var(--line);padding:8px 12px;margin-bottom:10px;font-size:12.5px;color:var(--muted)}
details.help summary{cursor:pointer;color:var(--text);font-family:var(--mono);font-size:12px}
details.help dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:10px 0 2px}
details.help dt{color:var(--text);font-family:var(--mono)}
details.help dd{margin:0}
.wrap{overflow:auto;border:1px solid var(--line);max-height:calc(100vh - 210px)}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12px}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:500;cursor:pointer;user-select:none}
th:hover{color:var(--text)}
th.l,td.l{text-align:left}
tbody tr:hover{background:var(--panel)}
td.tk{color:var(--accent);font-weight:600}
td.tk small{color:var(--muted);font-weight:400;margin-left:4px}
td.nm{max-width:220px;overflow:hidden;text-overflow:ellipsis;font-family:var(--sans)}
td.lt{font-size:15px;white-space:nowrap}td.ln{font-size:15px;font-weight:500;color:var(--text)}
.logo-s.logo-l{width:30px;height:30px;border-radius:6px}
th.sub,td.sub{padding-left:6px;padding-right:6px}th.sub{font-size:10px}
td.lm{max-width:230px;white-space:normal;font-size:12px;line-height:1.35}
.nmini{font-family:var(--mono);font-weight:600;font-size:12.5px}
.perf{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid;white-space:nowrap}
.perf.p0{color:#7ad19a;border-color:#7ad19a55;background:#7ad19a14}.perf.p1{color:#e0c26a;border-color:#e0c26a55;background:#e0c26a14}.perf.p2{color:#ef7b7b;border-color:#ef7b7b55;background:#ef7b7b14}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--muted)}
.tag{display:inline-block;padding:1px 6px;border:1px solid var(--line);font-size:11px}
.tag.Alta{color:var(--pos);border-color:var(--pos)}
.tag.Media{color:var(--blue);border-color:var(--blue)}
.tag.Baja{color:var(--accent);border-color:var(--accent)}
.tag.Muy{color:var(--neg);border-color:var(--neg)}
.flag{color:var(--accent);cursor:help}
.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line)}
.soon{max-width:720px;padding:24px;border:1px dashed var(--line);color:var(--muted);line-height:1.6}
.soon h2{font-family:var(--mono);font-size:14px;color:var(--text);margin:0 0 8px}
.mx{display:grid;grid-template-columns:minmax(300px,440px) 1fr;gap:16px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);padding:14px}
.card h3{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:500}
.big{font-size:22px;font-weight:600;margin:2px 0 4px}
.sub{color:var(--muted);font-size:13px;line-height:1.5}
.probs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.probs div{border:1px solid var(--line);padding:8px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.probs b{display:block;font-size:17px;color:var(--text);margin-top:2px}
.warn{margin-top:10px;padding:8px 10px;border-left:3px solid var(--accent);background:var(--panel2);font-size:12.5px;color:var(--text)}
.ejes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.ind{width:100%;border-collapse:collapse;font-size:12px}
.ind td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top;white-space:normal;text-align:left}
.ind td.r{text-align:right;white-space:nowrap;font-family:var(--mono)}
.ind .tipo{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em;padding-top:12px}
.ind small{display:block;color:var(--muted);font-size:11px;margin-top:2px;line-height:1.4}
.zb{display:inline-block;width:70px;height:8px;background:var(--panel2);position:relative;vertical-align:middle}
.zb i{position:absolute;top:0;bottom:0}
.zb:after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.hm{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
.hm th,.hm td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.hm th{position:static;cursor:default;background:none}
.hm td.l,.hm th.l{text-align:left;font-family:var(--sans)}
.hm .on{outline:2px solid var(--accent);outline-offset:-2px}
.comp{display:flex;gap:14px;font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:6px}
.comp b{color:var(--text);font-weight:500}
svg text{font-family:var(--mono)}
@media (max-width:900px){.mx,.ejes{grid-template-columns:1fr}.probs{grid-template-columns:repeat(2,1fr)}}
.sem{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.luz{display:flex;flex-direction:column;gap:6px;background:#06080b;padding:8px;border:1px solid var(--line)}
.luz i{width:22px;height:22px;border-radius:50%;background:#1b222c;display:block}
.luz i.on.rojo{background:var(--neg);box-shadow:0 0 12px var(--neg)}
.luz i.on.amarillo{background:var(--accent);box-shadow:0 0 12px var(--accent)}
.luz i.on.verde{background:var(--pos);box-shadow:0 0 12px var(--pos)}
.chk{display:grid;gap:6px;font-size:13px}
.chk div{display:flex;gap:8px;align-items:baseline}
.chk b{font-family:var(--mono);font-size:11px;padding:1px 6px;border:1px solid currentColor}
.res{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;margin-top:10px}
.res th,.res td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.res th{position:static;cursor:default;background:none;font-weight:500}
.res td.l,.res th.l{text-align:left;font-family:var(--sans)}
.semgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-top:16px}
@media (max-width:900px){.sem{grid-template-columns:auto 1fr}.semgrid{grid-template-columns:1fr}}
.sbar{display:inline-block;width:46px;height:6px;background:var(--panel2);vertical-align:middle;margin-left:6px;position:relative}
.sbar i{position:absolute;left:0;top:0;bottom:0}
td.sc{font-weight:600}
tr.det td{background:var(--panel);white-space:normal;text-align:left}
.detg{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;padding:8px 4px;font-family:var(--sans)}
.detg h4{margin:0 0 6px;font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.05em}
.detg div{font-size:12px}
.detg dl{display:grid;grid-template-columns:1fr auto;gap:3px 10px;margin:0}
.detg dt{color:var(--muted)}
.detg dd{margin:0;font-family:var(--mono);text-align:right}
.bar input[type=checkbox]{min-width:0;flex:none;max-width:none;padding:0}
.chkl{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.sig{display:inline-block;padding:1px 7px;border:1px solid currentColor;font-size:11px;font-family:var(--mono)}
.alr{display:block;font-family:var(--mono);font-size:10px;color:var(--accent);margin-top:2px;cursor:help}
.cmb{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:6px}
.cmb h4{margin:0 0 6px;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.05em}
.cmb div{font-size:12.5px;line-height:1.7}
.cmb b{font-family:var(--mono);color:var(--accent);font-weight:600}
@media (max-width:900px){.cmb{grid-template-columns:1fr 1fr}}
.aviso{padding:8px 12px;border-left:3px solid var(--accent);background:var(--panel);font-size:12.5px;margin-bottom:10px}
@media (max-width:900px){.detg{grid-template-columns:1fr 1fr}}
@media (max-width:640px){main{padding:12px}.wrap{max-height:none}.bar input{max-width:none}}
.nchip{display:inline-block;min-width:30px;text-align:center;padding:1px 4px;border:1px solid;font-size:11px}
.btn{background:none;border:1px solid var(--line);color:var(--text);padding:6px 12px;font-family:var(--mono);font-size:12px;cursor:pointer;margin-bottom:12px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.fhead{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;background:var(--panel);border:1px solid var(--line);padding:14px 16px;margin-bottom:12px}
.fhead h2{margin:2px 0 4px;font-size:22px}
.tk2{font-family:var(--mono);color:var(--accent);font-weight:600;font-size:15px}.tk2 small{color:var(--muted);font-weight:400}
.aviso{margin-top:8px;font-size:12px;color:var(--accent);border-left:2px solid var(--accent);padding-left:8px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px 14px;font-family:var(--mono);font-size:12px;margin-top:8px}
.kv span{display:block;color:var(--muted);font-size:11px}.kv b{font-weight:500}
.bsec{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:0 0 14px}
.fgrid .bsec{margin:0}
.bsec>.bh{background:linear-gradient(90deg,#22336f,#16204a);border-bottom:1px solid #2e4290;padding:11px 18px;color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.bsec>.bh span{color:#a9b6e8;font-weight:500;letter-spacing:0;text-transform:none;font-size:12px}
.bsec.main{border-color:#3a4f9e;box-shadow:0 0 0 1px rgba(232,194,100,.15)}
.bsec.main>.bh{background:linear-gradient(90deg,#3b3112,#22336f);font-size:13px}
.bsec>.bb{padding:14px 18px}
.bsec .wrap{border-radius:10px}
.tb2 thead th{background:#1d2b62;color:#dfe6ff;font-weight:600}
.tb2 td.big{font-size:15px;font-weight:700}
.rk td{font-size:14px;padding-top:11px;padding-bottom:11px}.rk .nchip{font-size:14px;padding:4px 10px}
.rk .pos-n{display:inline-block;width:18px;color:var(--muted);font-weight:600;font-size:12px}
.bh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap}
.bkpi{display:flex;gap:10px;flex-wrap:wrap}
.bkpi>div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:92px}
.bkpi span{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bkpi b{font-size:22px;font-weight:700}
.bhoy{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.bhoy>span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.bhoy .lst{margin-top:6px}
.dv-h,.dv{display:grid;grid-template-columns:minmax(150px,260px) 1fr 110px;gap:12px;align-items:center}
.dv-h{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 6px 6px}
.dv-h .dv-l,.dv-h .dv-r{display:none}
.dv{padding:5px 6px;border-radius:8px;cursor:pointer;opacity:.55}
.dv.cl{opacity:1}.dv:hover{background:var(--panel2);opacity:1}.dv.sel{background:#1b2a5e;opacity:1}
.dv-n{display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv.cl .dv-n{font-weight:600}
.dv-bar{display:grid;grid-template-columns:1fr 1fr;height:22px;border-left:0}
.dv-half{position:relative;height:100%}
.dv-half:first-child{border-right:1px solid #3a4a86}
.dv-fill{position:absolute;top:3px;bottom:3px;border-radius:4px}
.dv-fill.neg{right:0;background:var(--neg)}.dv-fill.pos{left:0;background:var(--pos)}
.dv:not(.cl) .dv-fill{opacity:.45}
.dv-v{position:absolute;top:50%;transform:translateY(-50%);font-size:11.5px;font-weight:700;white-space:nowrap}
.dv-v.l{left:4px;color:#ffb3b3}.dv-v.r{right:4px;color:#a8f0c6}
.dv-c{font-size:12.5px;text-align:right}.dv-c span{display:block;font-size:10.5px;color:var(--muted)}
.dv.cl .dv-c span{color:var(--accent)}
.seg.sm{padding:5px 12px;font-size:12px}.seg.on2{background:#22336f;color:#fff;border-color:#3a4f9e}
.bpt{position:absolute;transform:translate(-17px,-50%);display:flex;align-items:center;gap:6px;cursor:pointer;z-index:1}
.bpt .bc-ic{flex:0 0 30px;height:30px;background:#0d1430;box-shadow:0 0 0 1px var(--fc);opacity:.75}
.bpt.cl .bc-ic{flex-basis:36px;height:36px;opacity:1;box-shadow:0 0 0 2px var(--fc),0 0 12px var(--fc)}
.bpt .bc-ic svg{width:17px;height:17px;fill:none;stroke:var(--fc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bpt .bl-n{font-size:11px;color:#c8d0ea;white-space:nowrap;text-shadow:0 0 4px #000;opacity:.8}
.bpt.cl .bl-n{font-weight:700;color:var(--text);opacity:1}
.bpt.sel .bc-ic{box-shadow:0 0 0 3px var(--accent)}
.bpt:hover{z-index:5}.bpt:hover .ett{display:block}
.bc-ic.sm{display:inline-grid;width:26px;height:26px;flex:none}.bc-ic.sm svg{width:15px;height:15px;fill:none;stroke:var(--fc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hfoto{height:46px;width:auto;border-radius:9px;border:1px solid var(--accent);box-shadow:0 0 12px rgba(232,194,100,.25)}
.rsm{display:grid;grid-template-columns:minmax(260px,1fr) 1.4fr;gap:22px}
@media(max-width:900px){.rsm{grid-template-columns:1fr}}
.rsm-k{margin-bottom:14px}.rsm-k>span,.rsm-c>span,.rsm-t{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.rsm-k b{font-size:22px;font-weight:700}.rsm-k em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:2px}
.rsm-c div{display:grid;grid-template-columns:1fr auto 80px;gap:8px;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line)}
.rsm-c em{font-style:normal;color:#c8d0ea}.rsm-c i{font-style:normal;text-align:right;font-weight:600}
.rsm-t{color:var(--text)!important;font-weight:600;font-size:15px!important;letter-spacing:0!important;text-transform:none!important;margin-bottom:8px!important}
.vb{display:inline-block;font-size:10.5px;font-weight:700;color:var(--ec);margin-left:8px;vertical-align:middle;white-space:nowrap}
.okm{color:var(--pos);font-size:10px;font-weight:700;margin-left:3px}
.cxf th{white-space:normal;min-width:72px;vertical-align:bottom}.cxf th small{display:block;font-size:9.5px;color:var(--accent);font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-top:2px}
.cxf td sup.ok{color:var(--pos);font-size:9px;margin-left:2px}.cxf tbody tr:hover{background:var(--panel2)}
.fams2{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:0 14px;align-items:start}
.fams2 h4{margin:4px 0 6px;font-size:12px;color:var(--muted);font-weight:600}
td.lm{font-size:12px;white-space:normal;max-width:230px;min-width:170px;line-height:1.35}
.oos{margin:8px 0 4px}.oos td,.oos th{padding:4px 8px}
@media(max-width:640px){.fams2{grid-template-columns:1fr}}
.etq{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--ec);border:1px solid var(--ec);border-radius:20px;padding:1px 8px;margin-left:8px;vertical-align:middle;text-transform:uppercase}
.ctiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.ctile{background:var(--panel2);border:1px solid var(--line);border-top:3px solid var(--tc);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.ctile .ct-n{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tc);font-weight:600}
.ctile b{font-size:20px;font-weight:700;line-height:1.2}.ctile em{font-style:normal;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.ctile small{font-size:11.5px;color:#c8d0ea;line-height:1.35}.ctile small.mut{color:var(--muted);font-size:10.5px}
.cspk{width:100%;height:34px;margin:4px 0 2px;display:block}
.ctile{position:relative}.vd{position:absolute;top:8px;right:9px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;border:1px solid;cursor:help;letter-spacing:.03em}
.vd.bull{color:#7ad19a;border-color:#7ad19a66;background:#7ad19a1a}.vd.bear{color:#ef7b7b;border-color:#ef7b7b66;background:#ef7b7b1a}.vd.neu{color:#9aa5c8;border-color:#9aa5c855}
.ctile small.vdr{font-style:italic;color:#aab3d1;font-size:11px}
@media (max-width:640px){.vd{position:static;align-self:flex-start;margin-bottom:2px}}
@media (max-width:640px){.ctiles{grid-template-columns:1fr 1fr;gap:8px}.ctile{padding:8px 9px}.ctile b{font-size:16px}.ctile small{font-size:10.5px}.cspk{height:26px}}

<body>
<div id="gate">
  <form id="gf">
    <h1>MR Renta <em>Variable</em></h1>
    <input id="gp" type="password" placeholder="Clave" autocomplete="current-password" autofocus>
    <button type="submit">Entrar</button>
    <div class="err" id="ge"></div>
  </form>
</div>

<header>
  <div class="brand" style="display:inline-flex;align-items:center;gap:12px">MR Renta <em>Variable</em></div>
  <div class="kpis" id="kpis"></div>
  <div class="vivo"><span id="vivoMsg"></span><button id="vivoBtn" type="button" title="Trae los precios del momento de BYMA y EE.UU. (data912): precios, CCL implícito, premio de cada CEDEAR y distancia a la MA200.">ACTUALIZAR PRECIOS</button></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<script>
const HASH = "3a892eea646c4e4fc44df3a264545ce2e51f4bdc752cbd996dae588e5c839602";
const TABS = [
  {id:"macro", t:"Macro", ok:true},
  {id:"factores", t:"Factores", ok:true},
  {id:"empresas", t:"Empresas", ok:true},
  {id:"lista", t:"Lista", ok:true}
];
let D = null, M = null, E = null, FR = null, LM = null, BQ = null, tab = "macro";

async function sha(s){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
function ses(k,v){try{if(v===undefined)return sessionStorage.getItem(k);sessionStorage.setItem(k,v)}catch(e){return null}}
function loc(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

document.getElementById("gf").addEventListener("submit", async e=>{
  e.preventDefault();
  if (await sha(document.getElementById("gp").value) === HASH){ ses("rv_ok","1"); loc("rv_clave",HASH); abrir(); }
  else document.getElementById("ge").textContent = "Clave incorrecta";
});

async function abrir(){
  document.getElementById("gate").remove();
  try{
    const r = await fetch("data/datos.json?v=" + Date.now());
    if (r.ok) D = await r.json();
  }catch(e){}
  try{
    const r = await fetch("data/macro.json?v=" + Date.now());
    if (r.ok) M = await r.json();
  }catch(e){}
  try{
    const r = await fetch("data/empresas.json?v=" + Date.now());
    if (r.ok) E = await r.json();
  }catch(e){}
  try{
    const r = await fetch("data/frases.json?v=" + Date.now());
    if (r.ok) FR = await r.json();
  }catch(e){}
  try{
    const r = await fetch("data/logos_meta.json?v=" + Date.now());
    if (r.ok) LM = await r.json();
  }catch(e){}
  try{
    const r = await fetch("data/bloques.json?v=" + Date.now());
    if (r.ok) BQ = await r.json();
  }catch(e){}
  (E?.empresas||[]).forEach(x=>{ if (x.notas) x.notas.general = general(x.notas); });
  kpis(); navegar(); render();
}

const ratioNum = r => { const [a,b] = String(r||"").split(":").map(Number); return a&&b ? a/b : null; };
const mediana = a => { const v = a.filter(x=>x!=null&&isFinite(x)).sort((x,y)=>x-y); return v.length ? (v.length%2 ? v[(v.length-1)/2] : (v[v.length/2-1]+v[v.length/2])/2) : null; };

async function vivo(){
  const btn = document.getElementById("vivoBtn"), msg = document.getElementById("vivoMsg");
  if (!D) return;
  btn.disabled = true; msg.textContent = "Trayendo precios…";
  try{
    const [ru, ra] = await Promise.all([fetch("https://data912.com/live/usa_stocks"), fetch("https://data912.com/live/arg_cedears")]);
    if (!ru.ok || !ra.ok) throw new Error("http");
    const us = {}, ar = {};
    (await ru.json()).forEach(x=>{ if (x && x.symbol && x.c) us[x.symbol] = +x.c; });
    (await ra.json()).forEach(x=>{ if (x && x.symbol){ const p = x.c || x.px_ask || x.px_bid; if (p) ar[x.symbol] = +p; } });
    const pxUS = t => us[t] ?? us[t.replace("-",".")] ?? us[t.replace("-","")];
    let nu = 0, na = 0;
    D.tickers.forEach(x=>{
      const pu = x.ticker.endsWith(".KS") ? null : pxUS(x.ticker);
      if (pu && x.precio){
        if (x.vs_ma200!=null){ const ma = x.precio/(1+x.vs_ma200); x.vs_ma200 = pu/ma - 1; }
        x.precio = pu; nu++;
      }
      if (ar[x.byma]){ x.px_ars = ar[x.byma]; na++; }
      const k = ratioNum(x.ratio);
      x.ccl_impl = x.px_ars && x.precio && k && !x.ticker.endsWith(".KS") ? x.px_ars*k/x.precio : null;
    });
    const ccl = mediana(D.tickers.filter(x=>x.liquidez==="Alta").map(x=>x.ccl_impl));
    if (ccl){
      D.ccl = ccl;
      D.tickers.forEach(x=>{ const p = x.ccl_impl ? x.ccl_impl/ccl - 1 : null; x.premio = p!=null && Math.abs(p) <= 0.3 ? p : null; });
    }
    if (us.SPY && D.spy) D.spy.precio = us.SPY;
    const byB = {}; D.tickers.forEach(x=>byB[x.byma]=x);
    (E?.empresas||[]).forEach(x=>{ const d = byB[x.byma]; if (d){ x.precio = d.precio; x.px_ars = d.px_ars; x.premio = d.premio; x.vs_ma200 = d.vs_ma200; } });
    const h = new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
    msg.innerHTML = `Precios en vivo <b style="color:var(--text)">${h}</b> · ${nu} en EE.UU., ${na} en BYMA`;
    kpis(); render();
  }catch(e){
    msg.textContent = "No se pudo conectar con data912. Probá de nuevo en unos minutos.";
  }
  btn.disabled = false;
}
document.getElementById("vivoBtn").addEventListener("click", vivo);
document.addEventListener("click", e=>{ const a = e.target.closest("[data-como]"); if (!a) return; e.preventDefault(); tab="factores"; EST.fvista="como"; EST.sel=null; navegar(); window.scrollTo(0,0); render(); });

const pct = (x,d=1) => x==null ? "—" : (x>0?"+":"") + (x*100).toFixed(d).replace(".",",") + "%";
const cls = x => x==null ? "mut" : x>0 ? "pos" : x<0 ? "neg" : "";
const num = (x,d=2) => x==null ? "—" : x.toLocaleString("es-AR",{minimumFractionDigits:d,maximumFractionDigits:d});
const usd = x => x==null ? "—" : x>=1e6 ? (x/1e6).toFixed(1)+"M" : x>=1e3 ? (x/1e3).toFixed(0)+"k" : x.toFixed(0);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function kpis(){
  const k = document.getElementById("kpis");
  if (!D){ k.innerHTML = "<span>Sin datos todavía</span>"; return; }
  const f = new Date(D.actualizado).toLocaleString("es-AR",{dateStyle:"short",timeStyle:"short"});
  k.innerHTML = `<span>Actualizado <b>${f}</b></span><span>CCL implícito <b>${num(D.ccl,0)}</b></span>
  <span>S&P 500 3M <b class="${cls(D.spy?.r3m)}">${pct(D.spy?.r3m)}</b></span>`;
}

function navegar(){
  document.getElementById("nav").innerHTML = TABS.map(x=>
    `<button class="${x.id===tab?"on":""}" data-t="${x.id}">${x.t}${x.ok?"":'<span class="pr">·</span>'}</button>`).join("");
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t; if (["empresas","lista","factores"].includes(tab)){ EST.sel=null; EST.bloque=null; EST.vista=null; } window.scrollTo(0,0); navegar(); render()});
}

function render(){
  const m = document.getElementById("main");
  if (tab==="macro") return macro(m);
  if (tab==="factores"){ if (EST.sel) return ficha(m, EST.sel); return factoresTab(m); }
  if (tab==="lista"){ if (EST.vista==="cmp" && CMP.length) return comparador(m); if (EST.sel) return ficha(m, EST.sel); return lista(m); }
  return empresas(m);
}

const EST = {q:"", sector:"", pais:"", liq:"", fichas:false, sort:"general", dir:-1, sel:null, per:"5y", ftab:"resumen"};
const FCACHE = {};
const NOTAS = [["calidad","Calidad"],["solidez","Solidez"],["crecimiento","Crecimiento"],["valuacion","Valuación"],["tendencia","Tendencia"],["analistas","Analistas"]];
const NOTA_TXT = {calidad:"Rentabilidad, márgenes y flujo de caja. Escala absoluta: un 8 es un 8 en cualquier sector.",
  solidez:"Deuda, cobertura de intereses y liquidez. Escala absoluta.",
  crecimiento:"Ventas de los últimos 3 años y lo que esperan los analistas para el próximo año. Escala absoluta.",
  valuacion:"Qué tan barata está contra su sector (10 = de las más baratas). Relativa.",
  tendencia:"Momentum, distancia a la MA200 y rendimiento contra el SPY, contra las 125. Relativa.",
  analistas:"Revisiones de estimaciones y sorpresas en los últimos balances, contra las 125. Relativa."};
const big = x => x==null ? "—" : Math.abs(x)>=1e12 ? (x/1e12).toFixed(2).replace(".",",")+" T" : Math.abs(x)>=1e9 ? (x/1e9).toFixed(1).replace(".",",")+" B" : Math.abs(x)>=1e6 ? (x/1e6).toFixed(0)+" M" : x.toFixed(0);
const nx = (x,d=1) => x==null ? "—" : x.toFixed(d).replace(".",",");
const ncol = v => v==null ? "var(--line)" : v>=7 ? "var(--pos)" : v>=4.5 ? "var(--accent)" : "var(--neg)";
const chip = v => `<span class="nchip" style="background:${v==null?"var(--panel2)":ncol(v)};${v==null?"color:var(--muted)!important":""}">${v==null?"—":nx(v)}</span>`;
const fch2 = f => f ? new Date(f+"T12:00").toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"2-digit"}) : "—";
const dias = s => s ? Math.round((new Date(s) - new Date())/864e5) : null;
const PAIS = {"United States":"EE.UU.","Taiwan":"Taiwán","Brazil":"Brasil","China":"China","South Korea":"Corea","Netherlands":"Países Bajos","Japan":"Japón","United Kingdom":"Reino Unido","Germany":"Alemania","Switzerland":"Suiza","Argentina":"Argentina","Uruguay":"Uruguay","Luxembourg":"Luxemburgo","Canada":"Canadá","Israel":"Israel","Colombia":"Colombia","South Africa":"Sudáfrica","Denmark":"Dinamarca","Ireland":"Irlanda","Australia":"Australia","Nigeria":"Nigeria","Bermuda":"Bermudas","Singapore":"Singapur"};

const PESOS = {calidad:25, crecimiento:20, solidez:15, valuacion:15, analistas:15, tendencia:10};
function general(n){ if (!n) return null; if (n.general!=null) return n.general; const k = Object.keys(PESOS).filter(k=>n[k]!=null); if (k.length<3) return null; return Math.round(k.reduce((s,x)=>s+n[x]*PESOS[x],0)/k.reduce((s,x)=>s+PESOS[x],0)*10)/10; }
const BQDE = b => (BQ?.bloques||[]).find(x=>x.empresas.includes(b));
const lerp = (x, pts) => { if (x==null) return null; if (x<=pts[0][0]) return pts[0][1]; for (let i=1;i<pts.length;i++) if (x<=pts[i][0]) { const [a,va]=pts[i-1],[b,vb]=pts[i]; return va+(vb-va)*(x-a)/(b-a); } return pts[pts.length-1][1]; };
const medi = a => { const s=(a||[]).filter(v=>v!=null&&isFinite(v)).sort((p,q)=>p-q); if(!s.length) return null; const k=(s.length-1)/2; return (s[Math.floor(k)]+s[Math.ceil(k)])/2; };
const pc0 = (z,d=0) => z==null ? "—" : pct(z,d).replace("+","");
function metr(f){
  const an = (f.anual||[]).filter(r=>r.ventas>0);
  const u = an[an.length-1]||{};
  const me = an.filter(r=>r.m_ebit!=null);
  const ms = me.map(r=>r.m_ebit);
  const mu = me.length ? me[me.length-1].m_ebit : null;
  const pctl = me.length>=4 ? ms.filter(v=>v<mu).length/(ms.length-1) : null;
  const nets = an.slice(-10).map(r=>r.neto).filter(v=>v!=null);
  const nprom = nets.length>=4 ? nets.reduce((s,v)=>s+v,0)/nets.length : null;
  const mcap = f.mcap;
  const peC = nprom==null||!mcap ? null : nprom<=0 ? -1 : mcap/nprom;
  const peMed = f.pe_banda ? medi(f.pe_banda.pe) : null;
  const pe = f.val?.pe;
  const desc = pe && peMed ? pe/peMed - 1 : null;
  const srt = [...ms].sort((a,b)=>a-b);
  const thr = ms.length>=4 ? srt[Math.floor((srt.length-1)*0.75)] : null;
  const picos = thr==null ? [] : me.slice(0,-1).filter(r=>r.m_ebit>=thr).map(r=>{ const s_=an.find(z=>z.anio===r.anio+1); return {anio:r.anio, m:r.m_ebit, perd: !!(s_&&s_.neto<0), sig: s_&&r.neto>0&&s_.neto!=null&&s_.neto>=0 ? s_.neto/r.neto-1 : null}; }).filter(p=>p.perd||p.sig!=null);
  const a3 = an[an.length-4];
  const v3 = a3 && a3.ventas>0 && u.ventas ? Math.pow(u.ventas/a3.ventas,1/3)-1 : null;
  const cxv = r_ => r_ && r_.capex!=null && r_.ventas>0 ? Math.abs(r_.capex)/r_.ventas : null;
  const cx = cxv(u), cx3 = cxv(a3), cxc = u.capex!=null && u.fco>0 ? Math.abs(u.capex)/u.fco : null;
  const fcfy = u.fcf!=null && mcap ? u.fcf/mcap : null;
  const ap = an[an.length-2];
  const vg1 = ap && ap.ventas>0 && u.ventas ? u.ventas/ap.ventas-1 : null;
  const dn = u.deuda!=null ? (u.deuda-(u.caja||0)) : null;
  const dne = dn!=null && u.ebitda>0 ? dn/u.ebitda : null;
  const fcfm = u.fcf!=null && u.ventas>0 ? u.fcf/u.ventas : null, sbcv = u.sbc!=null && u.ventas>0 ? u.sbc/u.ventas : null;
  const sn_ = f.sensibilidades || {}, fxe_ = FX?.empresas?.[f.byma]?.f || {};
  const roe = u.neto!=null && u.patrimonio>0 ? u.neto/u.patrimonio : null, roa = u.neto!=null && u.activo>0 ? u.neto/u.activo : null, eqa = u.patrimonio!=null && u.activo>0 ? u.patrimonio/u.activo : null;
  const ex_ = {roe, roa, eqa, pvl: f.val?.pvl, btc: fxe_.bitcoin?.r ? fxe_.bitcoin.r.ef/100 : null, btce: etqEmp(f.byma,"bitcoin"), oil: fxe_.petroleo?.r ? fxe_.petroleo.r.ef/100 : null, oile: etqEmp(f.byma,"petroleo"), beta: sn_.beta, fcfm, sbcv, pfcf: f.val?.pfcf, cx, cx3, cxc, fcfy, vg1, dn, dne, fcf: u.fcf, deuda: u.deuda, caja: u.caja, dev: f.val?.rend_accionista!=null && f.val?.div_yield!=null && f.val.rend_accionista>=0 ? Math.max(f.val.rend_accionista, f.val.div_yield) : (f.val?.rend_accionista ?? f.val?.div_yield)};
  return {...ex_, mu, pctl, mmin: ms.length?Math.min(...ms):null, mmax: ms.length?Math.max(...ms):null, nanos: me.length, nprom, nn: nets.length, peC, peMed, pe, desc, picos, v3, mb: u.m_bruto, mid: u.m_id, pefwd: f.val?.pe_fwd, peg: f.val?.peg, div: f.val?.div_yield, r12m: f.precio_bloque?.r12m};
}
function notaBloque(x, f, bl){
  const L = bl.lente; if (!L) return general(x.notas);
  const n = Object.assign({}, x.notas||{});
  if (L.pesos.valuacion_ciclo!=null && f){ const k = metr(f); n.valuacion_ciclo = k.peC==null ? null : k.peC<0 ? 1 : Math.round(lerp(k.peC,[[6,10],[10,8],[15,6],[25,3.5],[40,1]])*10)/10; }
  const ks = Object.keys(L.pesos).filter(k=>n[k]!=null); if (ks.length<3) return null;
  return Math.round(ks.reduce((s,k)=>s+n[k]*L.pesos[k],0)/ks.reduce((s,k)=>s+L.pesos[k],0)*10)/10;
}
function rangoTxt(k){ if (k.pctl==null) return "—"; if (k.pctl>=1) return `máximo de ${k.nanos} años`; if (k.pctl<=0) return `mínimo de ${k.nanos} años`; return `${Math.round(k.pctl*100)}% de su historia`; }
function lecturaCiclo(f, k){
  const s = [];
  if (k.mu!=null) s.push(k.pctl==null ? `Margen EBIT del último año: <b>${pc0(k.mu)}</b>. Hay pocos años de historia para ubicarlo en su ciclo.` : `Margen EBIT del último año: <b>${pc0(k.mu)}</b>, ${k.pctl>=1?`<b>el más alto de los ${k.nanos} años con datos</b>`:k.pctl<=0?`el más bajo de los ${k.nanos} años con datos`:`más alto que el <b>${Math.round(k.pctl*100)}%</b> de sus otros años`} (rango ${pc0(k.mmin)} a ${pc0(k.mmax)}).${k.pctl>=0.75?" Está en la zona alta de su ciclo.":k.pctl<=0.25?" Está en la zona baja de su ciclo.":""}`);
  if (k.peC!=null) s.push(k.peC<0 ? `Sumando los últimos ${k.nn} años, la empresa <b>perdió plata en promedio</b>: el P/E de hoy (${nx(k.pe)}x) depende de que la ganancia actual se sostenga.` : `Con la ganancia de hoy el P/E es <b>${nx(k.pe)}x</b>; con la ganancia promedio de los últimos ${k.nn} años (US$ ${big(k.nprom)}) sería <b>${nx(k.peC)}x</b>.`);
  else s.push(`No hay suficientes años de ganancia para calcular el P/E del ciclo.`);
  if (k.desc!=null) s.push(k.desc<0 ? `Para que el P/E llegue a su mediana de los últimos años (${nx(k.peMed)}x) con el precio de hoy, la ganancia podría caer <b>${pc0(-k.desc)}</b>.` : `Su P/E está <b>${pc0(k.desc)}</b> por encima de su mediana de los últimos años (${nx(k.peMed)}x).`);
  if (k.picos.length) s.push(`Las otras veces que el margen estuvo en la zona alta: ${k.picos.map(p=>`<b>${p.anio}</b> → ${p.perd?"al año siguiente pasó a pérdida":`al año siguiente la ganancia ${p.sig>=0?"subió":"cayó"} ${pc0(Math.abs(p.sig))}`}`).join("; ")}.`);
  return s;
}
function lecturaFarma(f, k){
  const s = [];
  if (k.v3!=null) s.push(`Ventas: <b>${pct(k.v3,0)}</b> por año en los últimos 3 años.`);
  if (k.mb!=null) s.push(`Margen bruto <b>${pc0(k.mb)}</b>${k.mb>0.7?": típico de un negocio protegido por patentes.":k.mb<0.6?": bajo para una farma; indica un negocio con más productos sin patente o de dispositivos.":"."}`);

function factoresMes(){
  if (!FX?.factores?.length) return `<p class="mut">Cargando factores…</p>`;
  const d0 = new Date(new Date().getFullYear(), new Date().getMonth()-1, 1), lim = `${d0.getFullYear()}-${String(d0.getMonth()+1).padStart(2,"0")}`;
  const MS = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"], mtx = u => `${MS[+u.mes.slice(5,7)-1]}${u.en_curso?" (en curso)":""}`;
  const xs = FX.factores.map(f=>{ const u = (f.ultimos||[]).slice(-1)[0]; return u && u.z!=null && u.mes>=lim ? {f,u} : null; }).filter(Boolean).sort((a,b)=>Math.abs(b.u.z)-Math.abs(a.u.z)).slice(0,3);
  if (!xs.length) return `<p class="mut">Sin datos de este mes.</p>`;
  return xs.map(({f,u})=>{ const s_ = Math.sign(u.z);
    const bls = BQ.bloques.map(bl=>{ const z = FX.bloques[bl.id]?.f?.[f.id]; return z?.r && solido(z.e) ? {bl, v:z.r.ef*u.z} : null; }).filter(p=>p && Math.abs(p.v)>=0.5).sort((a,b)=>Math.abs(b.v)-Math.abs(a.v)).slice(0,3).sort((a,b)=>b.v-a.v);
    const emp = Object.entries(FX.empresas).map(([b,x])=>{ const e = etqEmp(b, f.id), z = x.f?.[f.id]; return z?.r && solido(e) ? {b, v:z.r.ef*u.z} : null; }).filter(p=>p && Math.abs(p.v)>=1).sort((a,b)=>Math.abs(b.v)-Math.abs(a.v)).slice(0,3);
    const chB = p => { const fm = FAM.find(q=>q.b.includes(p.bl.id)) || {c:"#8a94b8"}; return `<span class="rbl" data-irb2="${p.bl.id}" style="--fc:${fm.c}"><span class="bc-ic sm"><svg viewBox="0 0 24 24">${ICO[p.bl.id]||""}</svg></span>${esc(p.bl.nombre)} <b class="${cls(p.v)}">${efTxt(p.v)}</b></span>`; };

    + `<details class="help" style="margin-top:10px"><summary>Cómo se lee</summary><p class="mut small">Al lado de cada bloque o empresa: cuánto se movió históricamente contra el SPY en un mes con un movimiento de este tamaño. No es lo que pasó este mes ni lo que va a pasar: es a quién le pega más este tipo de movimiento. <a href="#" id="iresc">Ver todo en Factores →</a></p></details>`;
}

function lineas(sr, per){
  const n = {"1y":52,"3y":156,"5y":9999}[per];
  const i0 = Math.max(0, sr.f.length - n);
  const ser = [["p","var(--accent)","Empresa"],["spy","var(--blue)","SPY"],["etf","var(--muted)","ETF del sector"]].filter(([k])=>sr[k]);
  const norm = ser.map(([k,c,t])=>{ const b = sr[k][i0]; return {c,t,v:sr[k].slice(i0).map(x=>x/b*100)}; });
  const all = norm.flatMap(s=>s.v).filter(isFinite);
  const lo = Math.min(...all), hi = Math.max(...all), W=620, H=250, pl=40, pb=22;
  const X = i => pl + i/(norm[0].v.length-1)*(W-pl-8), Y = v => 8 + (hi-v)/(hi-lo||1)*(H-pb-8);
  const fs = sr.f.slice(i0);
  const ticks = [lo, (lo+hi)/2, hi].map(v=>`<line x1="${pl}" x2="${W-8}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${v.toFixed(0)}</text>`).join("");
  const xt = [0, Math.floor(fs.length/2), fs.length-1].map((i,j)=>`<text x="${X(i)}" y="${H-6}" text-anchor="${["start","middle","end"][j]}">${fs[i].slice(0,7)}</text>`).join("");
  const base = `<line x1="${pl}" x2="${W-8}" y1="${Y(100)}" y2="${Y(100)}" stroke="var(--muted)" stroke-dasharray="3 3"/>`;
  const paths = norm.map(s=>`<path d="${s.v.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join("")}" fill="none" stroke="${s.c}" stroke-width="${s.t==="Empresa"?2:1.3}"/>`).join("");
  const fin = norm.map(s=>`<span style="color:${s.c}">■ ${s.t} ${pct(s.v[s.v.length-1]/100-1,0)}</span>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Precio relativo">${ticks}${base}${paths}${xt}</svg><div class="leg">${fin} <span class="mut">· base 100 al inicio del período</span></div>`;
}

function barras(an){
  const xs = an.filter(x=>x.ventas!=null).slice(-10);
  if (!xs.length) return "";
  const W=1240, H=190, pl=10, bw=(W-pl*2)/xs.length, mx=Math.max(...xs.map(x=>x.ventas));
  const mg = xs.map(x=>x.m_ebit).filter(v=>v!=null), mlo=Math.min(0,...mg), mhi=Math.max(...mg,0.01);
  const Ym = v => 14 + (mhi-v)/(mhi-mlo||1)*(H-50);
  const b = xs.map((x,i)=>{ const h=(x.ventas/mx)*(H-50); return `<rect x="${pl+i*bw+bw*0.18}" y="${H-24-h}" width="${bw*0.64}" height="${h}" fill="var(--panel2)" stroke="var(--line)"/><text x="${pl+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${x.anio}</text><text x="${pl+i*bw+bw/2}" y="${H-28-h}" text-anchor="middle" class="mut">${big(x.ventas)}</text>`; }).join("");
  const pts = xs.map((x,i)=>x.m_ebit==null?null:[pl+i*bw+bw/2, Ym(x.m_ebit), x.m_ebit]).filter(Boolean);
  const l = pts.length>1 ? `<path d="${pts.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1]).join("")}" fill="none" stroke="var(--accent)" stroke-width="2"/>` : "";
  const d = pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--accent)"/><text x="${p[0]}" y="${p[1]-7}" text-anchor="middle" fill="var(--accent)">${(p[2]*100).toFixed(0)}%</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Ventas y margen">${b}${l}${d}</svg><div class="leg"><span class="mut">■ Ventas (USD)</span> <span style="color:var(--accent)">● Margen EBIT</span></div>`;
}

const FTABS = [["resumen","Resumen"],["sensib","Qué la mueve"],["analisis","Análisis"],["numeros","Números y valuación"],["mercado","Analistas y mercado"]];
const FGRUPO = {resumen:["resumen"], sensib:["sensib"], analisis:["nicho","analisis","vigilar"], numeros:["numeros","valuacion"], mercado:["analistas","posicion","cedear"]};
const FVIEJA = {nicho:"analisis", vigilar:"analisis", valuacion:"numeros", analistas:"mercado", cedear:"mercado", posicion:"mercado"};

function analizar(f){
  const an = (f.anual||[]).filter(x=>x.ventas!=null), u = an[an.length-1]||{}, u1 = an[an.length-2]||{}, u3 = an[an.length-4];
  const tr = f.trimestral||[], q = tr[tr.length-1], q4 = tr[tr.length-5];
  const a = f.analistas||{}, v = f.val||{}, pr = f.pares||{}, nt = f.notas||{}, pb = f.precio_bloque||{}, p = f.posicion||{};
  const banco = f.tipo==="banco";
  const P = (x,d=0) => pct(x,d), M = (x,d=0) => pct(Math.abs(x),d).replace("+",""), X = x => nx(x)+"x";
  const motivos = [], fort = [], ries = [];
  let pts = 0;
  const sumar = (c, txt) => { pts += c; motivos.push({c, txt}); };
  const yoyQ = (i) => { const a_=tr[i], b_=tr[i-4]; return a_&&b_&&a_.ventas&&b_.ventas ? a_.ventas/b_.ventas-1 : null; };
  const yl = yoyQ(tr.length-1);
  const yp = [tr.length-2,tr.length-3,tr.length-4].map(yoyQ).filter(z=>z!=null);
  const cagr = u3&&u3.ventas>0&&u.ventas>0 ? (u.ventas/u3.ventas)**(1/3)-1 : null;
  const base = yp.length ? yp.reduce((s,z)=>s+z,0)/yp.length : (u1.ventas&&u.ventas ? u.ventas/u1.ventas-1 : cagr);
  if (yl!=null && base!=null){
    if (yl > base + 0.03) sumar(1, `Las ventas aceleran: ${P(yl)} en el último trimestre contra ${P(base)} antes.`);
    else if (yl < base - 0.03) sumar(-1, `Las ventas desaceleran: ${P(yl)} en el último trimestre contra ${P(base)} antes.`);
  }
  if (!banco && q && q4 && q.m_ebit!=null && q4.m_ebit!=null){
    const d = q.m_ebit - q4.m_ebit;
    if (d > 0.01) sumar(1, `El margen EBIT sube a ${M(q.m_ebit)} (${M(q4.m_ebit)} un año antes).`);
    else if (d < -0.01) sumar(-1, `El margen EBIT baja a ${M(q.m_ebit)} (${M(q4.m_ebit)} un año antes).`);
  }
  const r90 = a.rev_0y_90;
  if (r90!=null){
    if (r90 > 0.02) sumar(1, `Los analistas suben su estimación de ganancias (${P(r90,1)} en 90 días).`);
    else if (r90 < -0.02) sumar(-1, `Los analistas bajan su estimación de ganancias (${P(r90,1)} en 90 días).`);
  }
  const ub = f.ultimo_balance;
  if (ub && ub.sorpresa!=null){
    if (ub.sorpresa > 0.02) sumar(1, `El último balance superó lo esperado por ${M(ub.sorpresa,1)}.`);
    else if (ub.sorpresa < -0.02) sumar(-1, `El último balance no alcanzó lo esperado (${P(ub.sorpresa,1)}).`);
  }
  const lev = r => !banco && r.ebitda>0 && (r.deuda!=null||r.caja!=null) ? ((r.deuda||0)-(r.caja||0))/r.ebitda : null;
  const l0 = lev(u), l1 = lev(u1);
  if (l0!=null && l1!=null && Math.max(l0,l1) > 0.5){
    if (l0 < l1 - 0.3) sumar(1, `Baja la deuda: de ${X(l1)} a ${X(l0)} EBITDA en el último año.`);
    else if (l0 > l1 + 0.3) sumar(-1, `Sube la deuda: de ${X(l1)} a ${X(l0)} EBITDA en el último año.`);
  }
  const tend = pts >= 2 ? "Mejora" : pts <= -2 ? "Empeora" : "Estable";
  const capital = (u.patrimonio||0)+(u.deuda||0)-(u.caja||0);
  const roic = !banco && u.ebit!=null && capital>0 ? u.ebit*0.79/capital : null;
  const roe = u.neto!=null && u.patrimonio>0 ? u.neto/u.patrimonio : null;
  const cob = u.ebit!=null && u.intereses ? u.ebit/u.intereses : null;
  const peh = (f.pe_historia||[]).filter(z=>z.pe>0&&z.pe<300).map(z=>z.pe).sort((a_,b_)=>a_-b_);
  const peMed = peh.length>=3 ? peh[Math.floor(peh.length/2)] : null;
  const add = (lst, peso, txt) => lst.push({peso, txt});
  if (banco){
    if (roe!=null && roe>=0.15) add(fort, roe, `Rentabilidad alta para un banco: ROE de ${M(roe)}.`);
    if (roe!=null && roe<0.08) add(ries, 0.1-roe, `Rentabilidad baja: ROE de ${P(roe)}.`);
  } else {
    if (roic!=null && roic>=0.2) add(fort, roic, `Muy rentable: ROIC de ${M(roic)}.`);
    if (u.m_ebit!=null && u.m_ebit>=0.25) add(fort, u.m_ebit, `Margen EBIT alto: ${M(u.m_ebit)}.`);
    if (u.m_fcf!=null && u.m_fcf>=0.15) add(fort, u.m_fcf, `Genera mucha caja: flujo libre de ${M(u.m_fcf)} de las ventas.`);
    if (l0!=null && l0<0) add(fort, 0.3, `Caja neta: tiene más efectivo que deuda.`);
    if (l0!=null && l0>3) add(ries, l0/10, `Deuda alta: ${X(l0)} EBITDA.`);
    if (cob!=null && cob<3 && u.ebit>0) add(ries, 0.4, `Cobertura de intereses ajustada: ${X(cob)}.`);
    if (u.m_ebit!=null && u.m_ebit<0) add(ries, 0.6, `Pierde plata a nivel operativo (margen EBIT ${P(u.m_ebit)}).`);
    if (u.fcf!=null && u.fcf<0) add(ries, 0.4, `Consume caja: flujo libre negativo (${big(u.fcf)}).`);
  }
  if (cagr!=null && cagr>=0.15) add(fort, cagr, `Crece rápido: ventas ${M(cagr)} por año en los últimos 3 años.`);
  if (cagr!=null && cagr<0) add(ries, -cagr+0.1, `Ventas en baja: ${M(cagr)} por año en los últimos 3 años.`);
  if (a.crec_eps_1y!=null && a.crec_eps_1y>=0.15) add(fort, a.crec_eps_1y/2, `Se espera que la ganancia crezca ${M(a.crec_eps_1y)} el próximo año.`);
  if (a.crec_eps_1y!=null && a.crec_eps_1y<0) add(ries, 0.3, `Se espera que la ganancia caiga ${M(a.crec_eps_1y)} el próximo año.`);
  const sp = (a.sorpresas||[]).filter(s=>s.sorpresa!=null);
  if (sp.length>=4 && sp.every(s=>s.sorpresa>0)) add(fort, 0.25, `Superó lo esperado en los últimos ${sp.length} balances.`);
  if (sp.length>=3 && sp.filter(s=>s.sorpresa<0).length>=2) add(ries, 0.3, `No alcanzó lo esperado en ${sp.filter(s=>s.sorpresa<0).length} de los últimos ${sp.length} balances.`);
  if (f.tipo!=="cripto"){
    if (nt.valuacion!=null && nt.valuacion>=7.5) add(fort, 0.3, `Barata contra su sector (nota de valuación ${nx(nt.valuacion)}).`);
    if (nt.valuacion!=null && nt.valuacion<=3) add(ries, 0.3, `Cara contra su sector (nota de valuación ${nx(nt.valuacion)}).`);
    if (v.pe && peMed){ const d=v.pe/peMed-1;
      if (d<=-0.2) add(fort, -d, `Cotiza ${M(d)} por debajo de su P/E histórico (${X(v.pe)} contra ${X(peMed)}).`);
      if (d>=0.3) add(ries, d/2, `Cotiza ${M(d)} por encima de su P/E histórico (${X(v.pe)} contra ${X(peMed)}).`); }
    if (v.pe && pr.pe && v.pe > pr.pe*1.8) add(ries, 0.35, `P/E de ${X(v.pe)}, muy por encima de la mediana de su sector (${X(pr.pe)}).`);
  }
  if (v.div_yield!=null && v.div_yield>=0.03) add(fort, v.div_yield*5, `Paga un dividendo de ${M(v.div_yield,1)} anual.`);
  if (nt.tendencia!=null && nt.tendencia>=8) add(fort, 0.2, `Tendencia de precio fuerte (nota ${nx(nt.tendencia)}).`);
  if (pb.vs_ma200!=null && pb.vs_ma200<-0.1) add(ries, 0.25, `Precio ${M(pb.vs_ma200)} debajo de su media de 200 ruedas.`);
  if (pb.vol1y!=null && pb.vol1y>0.55) add(ries, 0.2, `Muy volátil: volatilidad de ${M(pb.vol1y)} anual.`);
  if (p.short_float!=null && p.short_float>0.1) add(ries, p.short_float, `Interés corto alto: ${M(p.short_float)} del flotante apuesta a la baja.`);
  let dil = u.acciones && u3 && u3.acciones ? (u.acciones/u3.acciones)**(1/3)-1 : null;
  if (dil!=null && Math.abs(dil)>0.25) dil = null;
  if (dil!=null && dil>0.03) add(ries, dil, `Dilución: la cantidad de acciones crece ${M(dil,1)} por año.`);
  if (dil!=null && dil<-0.02) add(fort, -dil, `Recompra acciones: la cantidad baja ${M(dil,1)} por año.`);
  if (f.tipo==="cripto") add(ries, 0.9, `Depende sobre todo del precio del bitcoin.`);
  if (f.pais && f.pais!=="United States") add(ries, 0.15, `Riesgo país: opera principalmente desde ${esc(PAIS[f.pais]||f.pais)}.`);
  const top = l => l.sort((x,y)=>y.peso-x.peso).slice(0,5).map(z=>z.txt);
  return {tend, pts, motivos, fort: top(fort), ries: top(ries)};
}

function bandaPE(b, hoy){
  const v = b.pe, n = v.length, W=620, H=240, pl=40, pb=22;
  const srt = v.slice().sort((p,q)=>p-q), q = z => srt[Math.floor(z*(n-1))];
  const p25=q(0.25), p50=q(0.5), p75=q(0.75);
  const ys = v.concat(hoy?[hoy]:[]);
  const lo = Math.max(0, Math.min(...ys)*0.9), hi = Math.max(...ys)*1.05;
  const X = i => pl + i/(n-1)*(W-pl-10), Y = z => 8 + (hi-z)/(hi-lo||1)*(H-pb-8);
  const path = v.map((z,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(z).toFixed(1)).join("");
  const xt = [0, Math.floor(n/2), n-1].map((i,j)=>`<text x="${X(i)}" y="${H-6}" text-anchor="${["start","middle","end"][j]}">${b.f[i]}</text>`).join("");
  const yt = [lo,(lo+hi)/2,hi].map(z=>`<text x="${pl-6}" y="${Y(z)+4}" text-anchor="end">${z.toFixed(0)}</text>`).join("");
  const pos = hoy==null ? "" : hoy>p75 ? "por encima de su rango habitual (cara contra su historia)" : hoy<p25 ? "por debajo de su rango habitual (barata contra su historia)" : "dentro de su rango habitual";
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Banda de P/E">
    <rect x="${pl}" y="${Y(p75)}" width="${W-pl-10}" height="${Math.max(1,Y(p25)-Y(p75))}" fill="rgba(110,168,255,.12)"/>
    <line x1="${pl}" x2="${W-10}" y1="${Y(p50)}" y2="${Y(p50)}" stroke="var(--blue)" stroke-dasharray="4 4"/>
    ${yt}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${hoy?`<circle cx="${X(n-1)}" cy="${Y(Math.min(hoy,hi))}" r="4" fill="var(--text)"/>`:""}${xt}</svg>
    <div class="leg"><span style="color:var(--accent)">— P/E mensual</span><span style="color:var(--blue)">- - mediana ${nx(p50,0)}x</span><span class="mut">▮ rango habitual ${nx(p25,0)}x a ${nx(p75,0)}x</span></div>
    <p class="small" style="margin:6px 0 0">Hoy: <b>${hoy==null?"—":nx(hoy,1)+"x"}</b>${pos?`, ${pos}.`:""}</p>
    <p class="mut small">P/E con el precio de cada mes y la ganancia del último ejercicio publicado. Aproximado: supone la misma cantidad de acciones que hoy.</p>`;
}

function premioCh(ch){
  const n = ch.f.length, W=1240, H=230, pl=46, pb=22, hB=60;
  const ps = ch.premio, lo = Math.min(-0.03,...ps), hi = Math.max(0.03,...ps);
  const X = i => pl + i/(n-1)*(W-pl-10), Y = z => 8 + (hi-z)/(hi-lo)*(H-pb-hB-14);
  const mx = Math.max(...ch.monto_ars,1), bw = (W-pl-10)/n*0.7;
  const bars = ch.monto_ars.map((m,i)=>`<rect x="${X(i)-bw/2}" y="${H-pb-m/mx*hB}" width="${bw}" height="${m/mx*hB}" fill="var(--panel2)" stroke="var(--line)"/>`).join("");
  const path = ps.map((z,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(z).toFixed(1)).join("");
  const yt = [lo,0,hi].map(z=>`<line x1="${pl}" x2="${W-10}" y1="${Y(z)}" y2="${Y(z)}" stroke="${z===0?"var(--muted)":"var(--line)"}" ${z===0?'stroke-dasharray="3 3"':""}/><text x="${pl-6}" y="${Y(z)+4}" text-anchor="end">${(z*100).toFixed(0)}%</text>`).join("");
  const xt = [0, Math.floor(n/2), n-1].map((i,j)=>`<text x="${X(i)}" y="${H-6}" text-anchor="${["start","middle","end"][j]}">${ch.f[i].slice(0,7)}</text>`).join("");
  const prom = ps.reduce((s,z)=>s+z,0)/n;
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" style="margin-top:12px" role="img" aria-label="Premio del CEDEAR">${yt}${bars}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>${xt}</svg>
    <div class="leg"><span style="color:var(--accent)">— Premio contra el CCL de la canasta</span><span class="mut">▮ Volumen semanal en BYMA</span><span class="mut">Promedio del año: ${pct(prom)}</span></div>`;
}

function panelVigilar(f){
  const a = f.analistas||{}, pb = f.precio_bloque||{}, p = f.posicion||{}, dv = f.dividendos||{}, v = f.val||{};
  const hoy = new Date(); const dias = s => s ? Math.round((new Date(s+"T12:00")-hoy)/864e5) : null;
  const al = [];
  const db = dias(a.proximo_balance); if (db!=null && db>=0 && db<=21) al.push(["accent",`Presenta balance en ${db} días (${fch2(a.proximo_balance)}). En los últimos 4, la acción se movió en promedio ${pct(((a.sorpresas||[]).map(s=>Math.abs(s.reaccion||0)).reduce((x,y)=>x+y,0)/Math.max((a.sorpresas||[]).length,1)),1).replace("+","")} al día siguiente.`]);
  const dc = dias(dv.fecha_corte); if (dc!=null && dc>=0 && dc<=21) al.push(["pos",`Corte de dividendo en ${dc} días (${fch2(dv.fecha_corte)}).`]);
  if (f.premio!=null && f.premio>0.03) al.push(["neg",`El CEDEAR está ${pct(f.premio).replace("+","")} caro contra su precio en EE.UU.`]);
  if (f.premio!=null && f.premio<-0.03) al.push(["pos",`El CEDEAR está ${pct(-f.premio).replace("+","")} barato contra su precio en EE.UU.`]);
  if (pb.vs_ma200!=null && pb.vs_ma200<0) al.push(["neg",`Cotiza ${pct(-pb.vs_ma200).replace("+","")} debajo de su media de 200 ruedas.`]);
  if (pb.vs_max52!=null && pb.vs_max52<-0.25) al.push(["neg",`Está ${pct(-pb.vs_max52,0).replace("+","")} debajo de su máximo de 52 semanas.`]);
  if ((a.bajan_30d||0) > (a.suben_30d||0)+1) al.push(["neg",`Los analistas vienen bajando estimaciones: ${a.bajan_30d} bajan contra ${a.suben_30d||0} que suben en 30 días.`]);
  if ((a.suben_30d||0) > (a.bajan_30d||0)+3) al.push(["pos",`Los analistas vienen subiendo estimaciones: ${a.suben_30d} suben contra ${a.bajan_30d||0} que bajan en 30 días.`]);
  if (p.short_cambio!=null && p.short_cambio>0.2) al.push(["neg",`El interés corto subió ${pct(p.short_cambio,0).replace("+","")} en el último mes.`]);
  const A = analizar(f); if (A.tend==="Empeora") al.push(["neg","La tendencia del negocio empeora (ver Análisis)."]);
  if (f.liquidez==="Baja"||f.liquidez==="Muy baja") al.push(["accent",`Liquidez ${f.liquidez.toLowerCase()} en BYMA: conviene operar con órdenes límite.`]);
  const key = "rvnota:"+f.ticker; let nota = ""; try{ nota = localStorage.getItem(key)||""; }catch(e){}
  return `<section class="fgrid"><div class="card"><h3>Qué vigilar <span class="mut">· automático, con los datos de esta semana</span></h3>
    ${al.length?`<ul class="alist">${al.map(([c,t])=>`<li><i style="background:var(--${c})"></i>${t}</li>`).join("")}</ul>`:`<p class="mut">Nada para destacar esta semana.</p>`}</div>
    <div class="card"><h3>Tus notas</h3><textarea id="nota" class="nota" placeholder="Tesis, precio de entrada, qué esperás del próximo balance, por qué la mirás…">${esc(nota)}</textarea>
    <p class="mut small" id="notamsg">Se guardan solas en este navegador (no se comparten ni se suben al sitio). Si cambiás de computadora, no las vas a ver.</p></div></section>`;
}

    ${chart}</section>
    <section class="card"><div class="wrap" style="max-height:none"><table><thead><tr><th class="l"></th>${fs.map((f,j)=>`<th style="color:${cols[j]}">${logoImg(f.byma,"logo-s")}${esc(f.byma)}</th>`).join("")}</tr></thead><tbody>

const QC = {CSI:"#3ecf8e", REC:"#f0b429", EST:"#f2555a", DES:"#5aa9ff"};

function zbar(z){
  if (z==null) return '<span class="mut">—</span>';
  const w = Math.min(Math.abs(z),3)/3*50, c = z>=0 ? "var(--pos)" : "var(--neg)";
  return `<span class="zb" title="z = ${z.toFixed(2)}"><i style="${z>=0?`left:50%`:`right:50%`};width:${w}%;background:${c}"></i></span>`;
}

function cuadSVG(){
  const W=380, P=34, S=(W-2*P)/2, cx=P+S, cy=P+S, k=S/2.5;
  const pos = (g,i) => [cx + Math.max(-2.5,Math.min(2.5,i))*k, cy - Math.max(-2.5,Math.min(2.5,g))*k];
  const cel = {CSI:[P,P], REC:[cx,P], DES:[P,cy], EST:[cx,cy]};
  let o = `<svg viewBox="0 0 ${W} ${W}" width="100%" style="max-width:${W}px;display:block">`;
  for (const [q,[x,y]] of Object.entries(cel)){
    const p = M.probs[q], on = q===M.actual;
    o += `<rect x="${x}" y="${y}" width="${S}" height="${S}" fill="${QC[q]}" fill-opacity="${0.06+p*0.5}" stroke="${on?QC[q]:"var(--line)"}" stroke-width="${on?2:1}"/>`;
    o += `<text x="${x+10}" y="${y+20}" font-size="11" fill="var(--text)">${{CSI:"Crec. sin inflación",REC:"Recalentamiento",EST:"Estanflación",DES:"Desinflación"}[q]}</text>`;
    o += `<text x="${x+10}" y="${y+40}" font-size="18" font-weight="600" fill="${QC[q]}">${Math.round(p*100)}%</text>`;
  }
  const tr = M.historial.slice(-7);
  const pts = tr.map(h=>pos(h.g,h.i));
  o += `<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--text)" stroke-opacity=".5" stroke-dasharray="3 3"/>`;
  pts.forEach((p,j)=>{ const last=j===pts.length-1;
    o += `<circle cx="${p[0]}" cy="${p[1]}" r="${last?6:2.5}" fill="${last?"var(--text)":"var(--muted)"}"><title>${tr[j].f}</title></circle>`; });
  o += `<text x="${W/2}" y="${P-10}" font-size="10" fill="var(--muted)" text-anchor="middle">CRECIMIENTO ACELERA ↑</text>`;
  o += `<text x="${W/2}" y="${W-P+18}" font-size="10" fill="var(--muted)" text-anchor="middle">CRECIMIENTO FRENA ↓</text>`;
  o += `<text x="${P-10}" y="${W/2}" font-size="10" fill="var(--muted)" text-anchor="middle" transform="rotate(-90 ${P-10} ${W/2})">← INFLACIÓN BAJA</text>`;

    </details></div></div>`;
}

  const mt = EST.mtab || "resumen";
  const I = M.informativos || {};
  const tileGDP = I.gdpnow ? `<div class="pil"><div class="pil-h"><span>GDPNow · Fed de Atlanta<i class="inf" title="Estimación en tiempo real que se actualiza con cada dato nuevo; el PBI oficial sale un mes después del trimestre. Más de 2% es crecimiento sólido; menos de 0%, contracción. Informativo: no entra en el cálculo del régimen.">i</i></span><b style="color:${I.gdpnow.valor>=2?"var(--pos)":I.gdpnow.valor>=0?"var(--accent)":"var(--neg)"}">${I.gdpnow.valor>=0?"+":""}${nx(I.gdpnow.valor,1)}%</b></div>
    <p class="pil-l">Crecimiento estimado del PBI de EE.UU. para el ${esc(I.gdpnow.trimestre)}, anualizado.${I.gdpnow.anterior!=null?` ${esc(I.gdpnow.trim_anterior)}: ${I.gdpnow.anterior>=0?"+":""}${nx(I.gdpnow.anterior,1)}%.`:""}</p>
    </div>` : "";
  const n_ = I.nfci;
  const tileNFCI = n_ ? `<div class="pil"><div class="pil-h"><span>Condiciones financieras · Fed de Chicago<i class="inf" title="Resume tasas, spreads, volatilidad y acceso al financiamiento. Negativo: conseguir plata es más fácil que lo normal. Si sube rápido, suele anticipar problemas para la economía y para las acciones más especulativas.">i</i></span><b style="color:${n_.valor<0?"var(--pos)":"var(--neg)"}">${n_.valor>=0?"+":""}${nx(n_.valor,2)}</b></div>
    <p class="pil-l">${n_.valor<0?"Más laxas":"Más ajustadas"} que el promedio histórico; en 3 meses se ${n_.cambio_13s>0?"endurecieron":"relajaron"} (${n_.cambio_13s>=0?"+":""}${nx(n_.cambio_13s,2)}). Dato al ${esc(n_.fecha)}.</p>
    </div>` : "";
  let cuerpo = "";
  if (mt==="resumen") cuerpo = resumenMacro();
  else if (mt==="tasas") cuerpo = PIL ? sec("Tasas y Fed","",`<div class="pil-grid pg3">${PIL.indicadores.filter(x=>x.pilar==="tasas").map(pilarCard).join("")}</div>`) : "";
  else if (mt==="credito") cuerpo = pilaresHTML(true, tileNFCI);
  else cuerpo = `<section class="fgrid" style="align-items:start">
      ${sec("Dónde está EE.UU.","el punto blanco es hoy; los grises, los 6 meses anteriores",cuadSVG())}
      ${sec("Régimen más probable",`confirmado · ${M.duracion} ${M.duracion===1?"mes":"meses"} seguidos`,`<div class="big" style="color:${QC[M.actual]};font-size:28px;font-weight:700">${esc(q.nombre)}</div>
        <div class="sub">Probabilidad hoy ${Math.round(p*100)}% · actualizado ${new Date(M.actualizado).toLocaleDateString("es-AR")}</div>
        <div class="conv" style="--cc:${conviccion().c}"><b>${conviccion().n}</b><span>${conviccion().t}</span></div>
        ${M.crudo && M.crudo!==M.actual?`<div class="warn">Posible cambio a <b style="color:${QC[M.crudo]}">${esc(M.cuadrantes[M.crudo].nombre)}</b> (${Math.round(M.probs[M.crudo]*100)}%). Se confirma si se repite el mes que viene.</div>`:""}
        <div class="probs" style="margin-top:12px">${["CSI","REC","EST","DES"].map(k=>`<div style="border-color:${k===M.actual?QC[k]:"var(--line)"}">${esc(M.cuadrantes[k].nombre)}<b style="color:${QC[k]}">${Math.round(M.probs[k]*100)}%</b></div>`).join("")}</div>
        ${div.length?`<div class="warn">Datos y mercado no coinciden en ${div.map(g=>g==="inflacion"?"inflación":g).join(" e ")}: el mercado puede estar anticipando un cambio que los datos todavía no muestran.</div>`:""}
`)}
    </section>
    <details class="help" style="margin-bottom:16px"><summary>Cómo funciona el cálculo del régimen</summary>${sec("Cómo funciona el cálculo","",(()=>{ const H = (M.historial_rt||[]).slice(-4), cur = new Date().toISOString().slice(0,7), MS = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"], nm = f => MS[+f.slice(5,7)-1]+" "+f.slice(0,4);
      return `<div class="como">
      <div><h4>1. Cada mes se mide hacia dónde van el crecimiento y la inflación</h4>
        <p>No importa si la inflación es alta o baja, sino si se está <b>acelerando o frenando</b> en los últimos 3 meses, comparado con su propia historia. Lo mismo con el crecimiento. Con eso cada mes cae en uno de cuatro cuadrantes: crecimiento sin inflación, recalentamiento, estanflación o desinflación.</p>
        <p>Se usan dos tipos de datos: <b>oficiales</b> (actividad, empleo, producción, inflación), que pesan ${Math.round(M.peso_dato*100)}%, y <b>de mercado</b> (spreads, cíclicas contra defensivas, cobre contra oro, inflación esperada, petróleo), que pesan ${Math.round((1-M.peso_dato)*100)}% y reaccionan antes.</p></div>
      <div><h4>2. La probabilidad dice qué tan claro es el dato del mes</h4>
        <p>Es como el resultado de un partido entre los cuatro regímenes. Este mes: ${["CSI","REC","EST","DES"].map(k=>`${esc(M.cuadrantes[k].nombre)} <b style="color:${QC[k]}">${Math.round(M.probs[k]*100)}%</b>`).join(", ")}. Si el primero gana por mucho, el régimen es claro; si gana por poco, como ahora, es poco definido.</p></div>
      <div><h4>3. La confirmación evita cambiar de régimen por un solo mes</h4>
        <p>Para que un régimen nuevo pase a ser el oficial tiene que ganar <b>dos meses seguidos</b> o ganar con más de ${Math.round((M.umbral||0.45)*100)}%. Si no, se mantiene el anterior. Por eso puede estar confirmado y a la vez poco definido: se repitió, pero ganando por poco.</p>
        <table class="tb2" style="margin-top:8px"><thead><tr><th class="l">Mes</th><th class="l">Quién ganó ese mes</th><th class="l">Régimen oficial</th></tr></thead><tbody>${H.map(x=>`<tr><td class="l">${nm(x.f)}${x.f===cur?' <span class="mut">(en curso)</span>':""}</td><td class="l" style="color:${QC[x.q]}">${esc(M.cuadrantes[x.q].nombre)}</td><td class="l" style="color:${QC[x.qc]};font-weight:700">${esc(M.cuadrantes[x.qc].nombre)}</td></tr>`).join("")}</tbody></table></div>
      <div><h4>4. El mes en curso es provisorio</h4>
        <p>El dato del mes se calcula con lo que se sabe hasta ese día y se recalcula en cada actualización semanal. Recién cuando el mes termina queda el dato definitivo. Si la diferencia con el segundo es chica, todavía puede cambiar.</p></div>
      <div><h4>5. Los datos oficiales llegan con atraso</h4>
        <p>Actividad, empleo e inflación se publican 1 o 2 meses después. El régimen de un mes usa los datos oficiales publicados hasta ese momento, que en su mayoría son de 1 o 2 meses antes, más los datos de mercado del mismo mes. Cuando los datos de mercado y los oficiales no coinciden, se avisa: el mercado puede estar anticipando un cambio.</p></div>
      <div><h4>6. Dos versiones del historial</h4>
        <p>El cuadrante de esta pestaña usa los datos con sus correcciones posteriores. La caja de "qué pasó después" del Resumen usa los datos <b>tal como se conocían cada mes</b>, sin las correcciones, para no mirar el futuro. Por eso algunos meses viejos pueden diferir entre las dos.</p></div>
      </div>`; })())}</details>
    <details class="help" style="margin:0 0 14px"><summary>Ver los indicadores de crecimiento e inflación que definen el régimen</summary><div class="ejes" style="margin-top:12px">${tablaEje("crecimiento")}${tablaEje("inflacion")}</div></details>
    ${tileGDP?sec("Otro indicador de crecimiento","informativo",`<div class="pil-grid pg3">${tileGDP}</div>`):""}
    ${sec("Régimen mes a mes","",`${bandaSVG()}<div class="sub" style="margin-top:6px">${["CSI","REC","EST","DES"].map(k=>`<span style="color:${QC[k]}">■</span> ${esc(M.cuadrantes[k].nombre)}`).join(" &nbsp; ")}</div>`)}`;
  m.innerHTML = `<div class="ftabs mtabs">${MT.map(([k,t])=>`<button class="${k===mt?"on":""}" data-mt="${k}">${t}</button>`).join("")}</div>${cuerpo}`;
  m.querySelectorAll("[data-mt]").forEach(b=>b.onclick=()=>{ EST.mtab=b.dataset.mt; window.scrollTo(0,0); macro(m); });
  const ie = document.getElementById("iresc"); if (ie) ie.onclick = e => { e.preventDefault(); EST.fvista="si"; tab="factores"; navegar(); window.scrollTo(0,0); render(); };
  m.querySelectorAll("[data-e2]").forEach(b=>b.onclick=(ev)=>{ ev.preventDefault(); EST.sel=b.dataset.e2; EST.ftab="sensib"; EST.bloque=null; EST.vista=null; tab="empresas"; navegar(); window.scrollTo(0,0); render(); });
  m.querySelectorAll("[data-irb2]").forEach(b=>b.onclick=()=>{ EST.bloque=b.dataset.irb2; EST.sel=null; EST.vista=null; tab="empresas"; navegar(); window.scrollTo(0,0); render(); });
}

abrir();
</script>
</body>
</html>
